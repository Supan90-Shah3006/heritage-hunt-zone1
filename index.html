<body>

<div class="logobar" id="logobar" hidden></div>
<header class="top"><div class="top-in" id="hdr"></div></header>
<div id="banner"></div>
<nav class="tabs" id="tabs" hidden aria-label="Control room"></nav>
<main class="wrap" id="main"></main>
<footer class="foot" id="foot"></footer>
<div class="bar" id="bar" hidden></div>
<div class="modal" id="modal" hidden></div>
<div id="toast" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const PALETTE=[['#F28C28','Orange'],['#F5C518','Yellow'],['#4FB3E8','Sky Blue'],['#EC6FA8','Pink'],['#8E44AD','Violet'],['#1C1C1C','Black'],['#7B4A2A','Brown'],['#8A8A8A','Gray'],
  ['#2EAD4B','Green'],['#1F3A93','Navy Blue'],['#D62828','Red'],['#1E6B3A','Dark Green'],['#C19A6B','Light Brown'],['#D4A017','Golden'],['#F7F7F2','White'],['#12A4B6','Teal']];
const COLORS=PALETTE.map(p=>p[0]);
const colorName=c=>(PALETTE.find(p=>p[0].toLowerCase()===String(c).toLowerCase())||[])[1]||c;
const colorByName=n=>{const k=String(n).toLowerCase().replace(/[^a-z]/g,'');const al={grey:'gray',gold:'golden',navy:'navyblue',skyblue:'skyblue',lightblue:'skyblue'};
  const hit=PALETTE.find(p=>p[1].toLowerCase().replace(/[^a-z]/g,'')===(al[k]||k));return hit?hit[0]:null};
const inkOn=hex=>{const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex||'');if(!m)return '#fff';const [r,g,b]=m.slice(1).map(x=>parseInt(x,16));return (0.299*r+0.587*g+0.114*b)/255>0.62?'#1A1208':'#fff'};
const S={meta:{},spots:[],teams:[],board:[],log:[],alerts:[],pins:[],db:null,fs:null,auth:null,dl:null,role:null,spotId:null,tab:'dash',
  loaded:{},offline:false,pending:false,restoring:true,unsubs:[],showPins:false,openD:{},seen:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const range=n=>Array.from({length:n},(_,i)=>i+1);
const pad=(n,l=2)=>String(n).padStart(l,'0');
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const IC={
  dash:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  teams:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  spots:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  life:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="m4.93 4.93 4.24 4.24M14.83 14.83l4.24 4.24M14.83 9.17l4.24-4.24M4.93 19.07l4.24-4.24"/>',
  act:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/>',
  board:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
};
const icon=k=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- derived ---------- */
const N=()=>Math.max(1,Math.min(15,+S.meta.cluesToWin||8));
const LL=()=>Math.max(0,Math.min(10,+(S.meta.lifelines??3)));
const eventName=()=>S.meta.name||'Heritage Treasure Hunt';
const isLive=()=>S.meta.status==='live';
const teamById=id=>S.teams.find(t=>t.id===id);
const spotById=id=>S.spots.find(s=>s.id===id);
const spotLabel=id=>{const s=spotById(id);return s?`${pad(s.no)} · ${s.name}`:'Not set'};
const pinsOf=spotId=>S.pins.filter(p=>p.role==='vol'&&p.spotId===spotId);
const pinOf=spotId=>(pinsOf(spotId)[0]||{}).id||'';
const weakPin=p=>!p||String(p).length<6;
const byCode=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true});
function route(t){const r=(t.route||[]).slice(0,N()).map(x=>x||{});while(r.length<N())r.push({});return r}
function progress(t){const ck=t.checkins||{};let solved=0,next=null,last=null;
  for(const i of range(N())){const c=ck[i];if(c&&c.t){solved++;if(!last||c.t>last)last=c.t}else if(next===null)next=i}
  return {solved,next,last,finished:solved===N()}}
function llList(t){const l=t.lifelines||{};return range(LL()).map(i=>l[i]&&l[i].t?{slot:i,...l[i]}:null)}
const llUsed=t=>llList(t).filter(Boolean).length;
const startOf=t=>t.startAt||S.meta.startedAt||null;
function ranked(list){return (list||S.teams).filter(t=>!t.withdrawn).map(t=>({t,p:progress(t),ll:llUsed(t)})).sort((a,b)=>{
  if(a.p.finished!==b.p.finished)return a.p.finished?-1:1;
  if(a.p.finished)return (a.p.last-startOf(a.t))-(b.p.last-startOf(b.t))||a.ll-b.ll;
  return b.p.solved-a.p.solved||(a.p.last||9e15)-(b.p.last||9e15)||a.ll-b.ll||String(a.t.code).localeCompare(b.t.code)})}
function stepsAtSpot(spotId){const out=[];for(const t of S.teams){route(t).forEach((r,i)=>{if(r.spotId===spotId)out.push({t,step:i+1})})}return out}
function clueOf(t,n){const r=route(t)[n-1]||{};const sp=spotById(r.spotId);return r.clue||(sp&&sp.clue)||''}
function hintOf(t,n){const r=route(t)[n-1]||{};const sp=spotById(r.spotId);return r.hint||(sp&&sp.hint)||''}
function routeIssues(t){const r=route(t),iss=[];const ids=r.map(x=>x.spotId).filter(Boolean);
  if(ids.length<N())iss.push(`${N()-ids.length} route spot${N()-ids.length>1?'s':''} not set`);
  const dup=ids.filter((v,i)=>ids.indexOf(v)!==i);if(dup.length)iss.push('Same spot used twice: '+[...new Set(dup)].map(spotLabel).join(', '));
  const noClue=r.filter((x,i)=>x.spotId&&!clueOf(t,i+1)).length;if(noClue)iss.push(`${noClue} clue text${noClue>1?'s':''} missing`);
  return iss}

/* public scoreboard copy of a team: no players, phones, routes or clues */
const pubMap=m=>{const o={};for(const k in (m||{})){const v=m[k];if(v&&v.t)o[k]={t:v.t}}return o};
/* After the hunt ends the scoreboard copy also gets each team's visited spots, for the map. */
const revealSpots=()=>S.meta.status==='ended'||S.meta.liveSpots!==false;
function trailOf(t){return range(N()).map(i=>{const c=(t.checkins||{})[i];if(!c||!c.t)return null;const s=spotById(c.spot||route(t)[i-1].spotId);
  return {clue:i,t:c.t,name:s?s.name:'',lat:s&&s.lat!=null?s.lat:null,lng:s&&s.lng!=null?s.lng:null}}).filter(Boolean)}
const pubTeam=t=>{const pl=(t.players||[]).map(p=>String(p&&p.name||'').trim());
  return {name:t.name||'',code:t.code||'',color:t.color||'',withdrawn:!!t.withdrawn,startAt:t.startAt||null,checkins:pubMap(t.checkins),lifelines:pubMap(t.lifelines),
    players:pl.filter(Boolean),captain:pl[t.captain||0]||'',trail:revealSpots()?trailOf(t):null}};
const normBoard=b=>({name:b.name||'',code:b.code||'',color:b.color||'',withdrawn:!!b.withdrawn,startAt:b.startAt||null,checkins:pubMap(b.checkins),lifelines:pubMap(b.lifelines),
  players:b.players||[],captain:b.captain||'',trail:b.trail||null});
const stable=v=>v&&typeof v==='object'&&!Array.isArray(v)?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}':JSON.stringify(v??null);
const quiet=p=>{Promise.resolve(p).catch(()=>{})};
function boardSet(id,t){if(S.fs)quiet(S.fs.doc('board/'+id).set(pubTeam(t)))}
function boardMap(id,field,n,v){if(S.fs)quiet(S.fs.doc('board/'+id).set({[field]:{[n]:v&&v.t?{t:v.t}:null}},{merge:true}))}

/* ---------- formatting ---------- */
function fmtT(ts){if(!ts)return '—';return new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function fmtHM(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDur(ms){if(ms==null||isNaN(ms)||ms<0)return '—';const s=Math.floor(ms/1000);return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}
function timeCell(t,p){const st=startOf(t);if(!st)return '<span class="muted">—</span>';
  if(p.finished)return `<b class="num">${fmtDur(p.last-st)}</b>`;
  if(t.withdrawn)return '<span class="muted">Withdrawn</span>';
  if(!isLive())return `<span class="num muted">${p.last?fmtDur(p.last-st):'—'}</span>`;
  return `<span class="num" data-since="${st}">${fmtDur(Date.now()-st)}</span>`}
function dots(t){return `<span class="dots" title="${LL()-llUsed(t)} of ${LL()} lifelines left">${llList(t).map(x=>`<i class="${x?'used':'left'}"></i>`).join('')}</span>`}
function pipsBar(t,p){return `<span class="pips">${range(N()).map(k=>`<i class="${(t.checkins||{})[k]?.t?'on':p.next===k&&isLive()&&!t.withdrawn?'nx':''}"></i>`).join('')}</span>`}
function dateLabel(){return S.meta.date?new Date(S.meta.date+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}
function fmt12(hm){const [h,m]=String(hm).split(':').map(Number);if(isNaN(h))return hm;return `${((h+11)%12)+1}:${pad(m||0)} ${h<12?'AM':'PM'}`}
const openAttr=(k,def)=>(S.openD[k]??def)?'open':'';

/* ---------- toast / errors ---------- */
function toast(msg,kind){const d=document.createElement('div');if(kind)d.className=kind;d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3800)}
function errMsg(e){const c=e&&e.code;
  if(c==='permission-denied')return 'The database refused this change. Your PIN may have been changed; sign in again.';
  if(c==='resource-exhausted')return 'Too many changes at once. Wait a few seconds and try again.';
  return 'Could not save. Check your connection and try again.'}
async function save(fn,ok){if(!S.db){toast('Live data is not available in this view.','bad');return false}
  try{await fn();if(ok)toast(ok);return true}catch(e){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));if(e&&e.code==='unavailable'){await fn();if(ok)toast(ok);return true}}catch(e2){e=e2}console.error(e);toast(errMsg(e),'bad');return false}}
function logEv(type,text,extra){if(!S.db)return;S.db.collection('log').add({t:Date.now(),type,text,...(extra||{})}).catch(()=>{})}
function saveMeta(patch){return S.db.doc('meta/event').set(patch,{merge:true})}

/* ---------- render ---------- */
function render(opts){opts=opts||{};const main=$('#main');const ae=document.activeElement;
  if(!opts.force&&ae&&main.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&main.childElementCount){S.pending=true;renderHeader();return}
  const saved={};if(!opts.fresh)main.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{saved[e.id]=e.type==='checkbox'?e.checked:e.value});
  renderHeader();renderBanner();renderNav();renderBar();renderFoot();
  const staff=S.role==='admin'||S.role==='vol';
  let html;
  if(S.db&&(!S.loaded.meta||S.restoring||(staff&&(!S.loaded.spots||!S.loaded.teams))))html='<p class="muted" style="text-align:center;padding:40px 0">Loading…</p>';
  else if(S.role==='admin')html=vAdmin();else if(S.role==='vol')html=vVol();else if(S.role==='board')html=vBoard();else html=vLogin();
  document.body.classList.toggle('home',!S.role);
  main.innerHTML=html;
  for(const id in saved){const e=document.getElementById(id);if(e&&!e.hasAttribute('data-live')){if(e.type==='checkbox')e.checked=saved[id];else e.value=saved[id]}}
  if(S.role==='board'&&S.boardTab==='map')mountMap();
  tick()}
document.addEventListener('focusout',()=>setTimeout(()=>{const ae=document.activeElement;if(S.pending&&!(ae&&$('#main').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))){S.pending=false;render()}},80));
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.k){S.openD[d.dataset.k]=d.open;if(d.dataset.k==='vol-guide')lsSet('hh.vguideClosed',!d.open)}},true);

function renderHeader(){const st=S.meta.status||'setup';
  const s=spotById(S.spotId);
  const sub=S.role==='admin'?'Control room':S.role==='vol'?(s?`Spot ${pad(s.no)} · Volunteer`:'Volunteer'):S.role==='board'?'Live scoreboard':
    [S.meta.series,dateLabel(),S.meta.startTime?fmt12(S.meta.startTime):''].filter(Boolean).join(' · ')||'Old City, Ahmedabad';
  const clock=st==='live'&&S.meta.startedAt?` <span class="num" data-since="${S.meta.startedAt}"></span>`:'';
  $('#hdr').innerHTML=`<div class="brand"><span class="ell">${esc(sub)}</span><h1 class="ell">${esc(eventName())}</h1></div>
  <span class="status ${st}"><i></i>${st==='live'?'Live':st==='ended'?'Ended':'Not started'}${clock}</span>
  ${S.role?`<button class="ibtn" data-act="logout" title="${S.role==='board'?'Exit scoreboard':'Sign out'}" aria-label="${S.role==='board'?'Exit scoreboard':'Sign out'}">${icon('out')}</button>`:''}`}
const LOGOS=[['logos/rotary.png','Rotary District 3055'],['logos/impact.png','Create Lasting Impact'],['logos/unicorn.png','Emerge as Unicorn, DRR PHF Aneri Bhatt, RID 3055, RIY 2026-27'],['logos/rotaract.png','Rotaract District 3055']];
const HOSTS=[['logos/host-kankaria.png','Rotaract Club of Kankaria'],['logos/host-emerald.png','Rotaract Club of Ahmedabad Emerald'],['logos/host-indus.png','Rotaract Club of Ahmedabad Indus University']];
const imgs=list=>list.map(([src,alt])=>`<img src="${src}" alt="${esc(alt)}" loading="lazy">`).join('');
$('#logobar').innerHTML=`<div class="in">${imgs(LOGOS)}</div>`;
const logoBand=cls=>`<div class="logos ${cls||''}"><div class="lgrp">${imgs(LOGOS)}</div><div class="lgrp hostgrp"><span class="lbl">Hosted by</span>${imgs(HOSTS)}</div></div>`;
function renderFoot(){const f=$('#foot');$('#logobar').hidden=!!S.role;
  const year=(S.meta.date||'').slice(0,4)||new Date().getFullYear();
  const copy=`<p class="copy">© ${esc(year)} ${esc(S.meta.presenter||'Rotaract District 3055')}. All rights reserved.</p>`;
  if(S.role!=='admin'&&S.role!=='vol'){f.innerHTML=copy;return}
  f.innerHTML=`${logoBand()}<p>${esc(S.meta.series||'')}${S.meta.series?' · ':''}${esc(eventName())}${S.meta.presenter?' · '+esc(S.meta.presenter):''}</p>${copy}`}
function renderBanner(){const b=S.meta.broadcast;const el=$('#banner');
  if(b&&b.msg&&(S.role==='admin'||S.role==='vol')){el.className='banner';el.innerHTML=`<div class="in"><b>Control room · ${fmtT(b.t)}</b><span>${esc(b.msg)}</span></div>`}else{el.className='';el.innerHTML=''}}
const TABS=[['dash','Live','dash'],['teams','Teams','teams'],['spots','Spots','spots'],['life','Lifelines','life'],['act','Alerts','act'],['set','Settings','set']];
function renderNav(){const n=$('#tabs');const on=S.role==='admin'&&!S.restoring;n.hidden=!on;document.body.classList.toggle('has-tabs',on);
  if(!on){n.innerHTML='';return}const open=S.alerts.filter(a=>!a.resolved).length;
  n.innerHTML=`<div class="in">${TABS.map(([k,l,ic])=>`<button aria-current="${S.tab===k}" data-act="tab" data-tab="${k}">${icon(ic)}<span>${l}</span>${k==='act'&&open?`<span class="badge">${open}</span>`:''}</button>`).join('')}</div>`}
function renderBar(){const b=$('#bar');const on=S.role==='vol'&&!!spotById(S.spotId);b.hidden=!on;document.body.classList.toggle('has-bar',on);
  if(!on){b.innerHTML='';return}const ph=S.meta.phone||S.meta.phone2;
  b.innerHTML=`<div class="in">${ph?`<a class="btn" href="${esc(telHref(ph))}">${icon('phone')}Call</a>`:`<button class="btn" disabled>${icon('phone')}Call</button>`}
  <button class="btn gold" data-act="reqHint">${icon('life')}Hint</button><button class="btn danger" data-act="sos">${icon('warn')}Alert</button></div>`}
function tick(){const now=Date.now();document.querySelectorAll('[data-since]').forEach(e=>{e.textContent=fmtDur(now-+e.dataset.since)});document.querySelectorAll('[data-ago]').forEach(e=>{e.textContent=fmtAgo(now-+e.dataset.ago)})}
setInterval(tick,1000);

/* ---------- login ---------- */
const GATE=`<svg class="gate" viewBox="0 0 600 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
<g style="fill:var(--gate)">${Array.from({length:30},(_,i)=>`<rect x="${6+i*20}" y="14" width="10" height="10"/>`).join('')}<rect x="0" y="22" width="600" height="98"/></g>
<g style="fill:var(--gate2)"><rect x="0" y="30" width="600" height="3"/><rect x="0" y="112" width="600" height="8"/></g>
<g style="fill:var(--wood)">${[[95,110],[245,110],[395,110]].map(([x,w])=>`<path d="M${x} 120V74Q${x} 46 ${x+w/2} 36Q${x+w} 46 ${x+w} 74V120Z"/>`).join('')}
${[45,555].map(x=>`<path d="M${x-10} 70V56Q${x-10} 48 ${x} 44Q${x+10} 48 ${x+10} 56V70Z"/>`).join('')}</g>
<g style="fill:var(--gold)" opacity=".55">${[150,300,450].map(x=>`<circle cx="${x}" cy="30" r="3"/>`).join('')}</g></svg>`;
function vLogin(){const m=S.meta;
  return `<section class="login">
  <div class="hero"><div class="hero-in">
    ${m.presenter?`<span class="presents">${esc(m.presenter)} presents</span>`:''}
    ${m.series?`<span class="series">${esc(m.series)}</span>`:''}
    <h2>${esc(eventName())}</h2><span class="guj" lang="gu">અમદાવાદ</span>
    <span class="unesco">India's first UNESCO World Heritage City</span>
    <div class="orn"><i></i></div>
    ${m.tagline?`<p class="tag">${esc(m.tagline)}</p>`:''}
    <div class="facts">${dateLabel()?`<span><b>Date</b>${esc(dateLabel())}</span>`:''}${m.startTime?`<span><b>Time</b>${esc(fmt12(m.startTime))} onwards</span>`:''}${m.venue?`<span><b>Venue</b>${esc(m.venue)}</span>`:''}</div>
    ${m.motto?`<div class="motto">${esc(m.motto)}</div>`:''}
    <div class="hosts"><b>Hosted by</b></div><div class="hostcard">${imgs(HOSTS)}</div>
    ${m.hosts?`<div class="hostnames">${m.hosts.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
  </div>${GATE}</div>
  <div class="hstats"><span class="pill">${S.board.length} teams</span>${m.spotCount?`<span class="pill">${m.spotCount} heritage spots</span>`:''}<span class="pill">${N()} clues to finish</span><span class="pill">${LL()} lifelines per team</span>${m.finish?`<span class="pill">Finish: ${esc(m.finish)}</span>`:''}</div>
  ${S.offline?`<div class="panel warnline">Not connected to the database. Open <b>firebase-config.js</b>, paste your Firebase settings, and upload the site again (see the setup guide).</div>`:''}
  <div class="doors">
    <form class="door" data-form="adminLogin" autocomplete="off"><span class="kick">Organisers</span><h3>Control room</h3>
      <p class="muted small">Run the hunt from one place: manage teams, routes and volunteers, send lifeline hints and follow every team live.</p>
      <label class="f">Admin PIN<input type="password" inputmode="numeric" id="lg-apin" autocomplete="off" maxlength="12"></label>
      <button class="btn pri" type="submit">Open control room</button><span class="err" id="lg-aerr"></span></form>
    <form class="door" data-form="volLogin" autocomplete="off"><span class="kick">At a spot</span><h3>Spot volunteer</h3>
      <p class="muted small">See which teams are heading to your spot, record each arrival and hand over the team's next clue.</p>
      <label class="f">Your spot PIN<input type="password" inputmode="numeric" id="lg-vpin" autocomplete="off" maxlength="12"></label>
      <button class="btn pri" type="submit">Open my spot</button><span class="err" id="lg-verr"></span></form>
    <div class="door"><span class="kick">Everyone</span><h3>Live scoreboard</h3>
      <p class="muted small">Follow the race as it happens: live standings and every team's progress, ready for the big screen at the start and finish.</p>
      <button class="btn" data-act="board">Show scoreboard</button></div>
  </div>
  <details class="panel" data-k="how" ${openAttr('how',false)}><summary><span class="display" style="font-size:19px;font-weight:400">How the hunt works</span></summary>
    ${flow([`At the start${m.startPoint?' ('+esc(m.startPoint)+')':''} the control room hands each team Clue #1. Every team has its own route of ${N()} spots.`,
    `Clue #1 leads to the team's first spot. The volunteer there taps <b>Mark arrived</b>, which records the time, and hands over Clue #2.`,
    `This repeats spot by spot. Stuck teams call the control room to use a lifeline (${LL()} each) and get a hint for their current clue.`,
    `Arrival at spot #${N()} completes the hunt. The first team to finish wins.`])}</details>
  </section>`}

/* ---------- admin ---------- */
function vAdmin(){return ({dash:aDash,teams:aTeams,spots:aSpots,life:aLife,act:aAct,set:aSet}[S.tab]||aDash)()}

function boardTable(rows){
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th>${range(N()).map(i=>`<th class="c">${i}</th>`).join('')}<th class="c">Solved</th><th>Lifelines</th><th class="r">Time</th></tr></thead><tbody>
  ${rows.map((r,ix)=>{const {t,p}=r;const rt=route(t);
    const cells=range(N()).map(i=>{const c=(t.checkins||{})[i];const ttl=`Clue ${i} → ${spotLabel(rt[i-1].spotId)}`;
      if(c&&c.t)return `<td class="c"><span class="pip done" title="${esc(ttl)} · arrived ${fmtT(c.t)}">${fmtHM(c.t)}</span></td>`;
      if(p.next===i&&isLive()&&!t.withdrawn)return `<td class="c"><span class="pip next" title="${esc(ttl)} · solving now">→</span></td>`;
      return `<td class="c"><span class="pip" title="${esc(ttl)}"></span></td>`}).join('');
    return `<tr class="click" data-act="progress" data-id="${t.id}"><td class="num">${ix+1}</td>
    <td><span class="tname"><span class="sw" style="--c:${t.color||'#888'}"></span>${esc(t.name)}${p.finished?' <span class="pill ok">Finished</span>':''}</span></td>
    ${cells}<td class="c num">${p.solved}/${N()}</td><td>${dots(t)}</td><td class="r">${timeCell(t,p)}</td></tr>`}).join('')}
  </tbody></table></div>`}
function raceBoard(rows){if(!rows.length)return `<div class="empty">No teams yet. Register teams in the Teams tab.</div>`;
  return `<div class="only-wide">${boardTable(rows)}</div><div class="list only-narrow">${rows.map(({t,p},ix)=>`<button class="li" data-act="progress" data-id="${t.id}">
    <span class="rk ${ix===0&&p.finished?'first':''}">${ix+1}</span>
    <span class="grow"><span class="t"><span class="sw" style="--c:${t.color||'#888'}"></span><span class="ell">${esc(t.name)}</span>${p.finished?'<span class="pill ok">Done</span>':''}</span>${pipsBar(t,p)}</span>
    <span class="r"><span class="small">${timeCell(t,p)}</span><span class="s num">${p.solved}/${N()}</span>${dots(t)}</span></button>`).join('')}</div>`}

function setupPanel(){if(!(S.loaded.spots&&!S.spots.length&&!S.meta.name))return '';
  return `<div class="card hl-gold stack" style="margin-bottom:18px"><div><b>First-time setup</b><p class="small muted">The database is empty. Choose the <b>seed-data.js</b> file from your computer to load the event details, the spots and the example teams.</p></div>
  <div><label class="btn gold">Choose seed-data.js<input type="file" accept=".js,.json" data-seed hidden></label></div></div>`}
function securityPanel(){if(!S.loaded.pins||!S.spots.length)return '';
  const noPin=S.spots.filter(s=>!pinOf(s.id)),weak=S.spots.filter(s=>pinOf(s.id)&&weakPin(pinOf(s.id)));const adminWeak=S.pins.some(p=>p.role==='admin'&&weakPin(p.id));
  if(!noPin.length&&!weak.length&&!adminWeak)return '';
  return `<div class="card hl-warn stack" style="margin-bottom:18px"><div class="row warn-t">${icon('lock')}<b>Tighten access</b></div>
  <ul class="small" style="margin:0;padding-left:18px">${noPin.length?`<li>${noPin.length} spot${noPin.length>1?'s have':' has'} no PIN, so no volunteer can open ${noPin.length>1?'them':'it'}.</li>`:''}
  ${weak.length?`<li>${weak.length} spot PIN${weak.length>1?'s are':' is'} short and easy to guess.</li>`:''}${adminWeak?'<li>The admin PIN is short. Use 6 or more digits.</li>':''}</ul>
  <div class="row">${noPin.length?'<button class="btn sm pri" data-act="genPins">Create missing PINs</button>':''}${weak.length?'<button class="btn sm" data-act="genPins" data-all="1" data-confirm="Tap again: volunteers will need the new PINs">Replace all spot PINs</button>':''}${adminWeak?'<button class="btn sm" data-act="tab" data-tab="set">Change admin PIN</button>':''}</div></div>`}

function aDash(){const rows=ranked();const openA=S.alerts.filter(a=>!a.resolved);const st=S.meta.status||'setup';
  const llTotal=S.teams.reduce((a,t)=>a+llUsed(t),0);
  const ctrl=st==='setup'?`<div class="card row sp" style="margin-bottom:18px"><div><b>The hunt hasn't started</b><p class="small muted">Starting sets the clock for every team.</p></div><button class="btn gold" data-act="start">Start the hunt</button></div>`:
    st==='ended'?`<div class="card row sp" style="margin-bottom:18px"><div><b>The hunt has ended</b><p class="small muted">Final standings are below.</p></div><button class="btn" data-act="tab" data-tab="set">Export results</button></div>`:'';
  return `${setupPanel()}${securityPanel()}${ctrl}
  ${openA.length?`<button class="card hl-bad row sp" style="width:100%;text-align:left;cursor:pointer;margin-bottom:18px;color:inherit" data-act="tab" data-tab="act">
    <span style="flex:1;min-width:0"><b class="bad-t">${openA.length} open alert${openA.length>1?'s':''}</b>${openA.slice(0,2).map(a=>`<span class="small" style="display:block">${fmtT(a.t)} · ${esc(spotLabel(a.spotId))} · ${esc(a.type)}</span>`).join('')}</span><span class="btn sm">View</span></button>`:''}
  <div class="stats"><div class="stat"><span>Teams</span><b>${rows.length}</b></div><div class="stat"><span>On course</span><b>${rows.filter(r=>!r.p.finished&&r.p.solved>0).length}</b></div>
   <div class="stat"><span>Finished</span><b>${rows.filter(r=>r.p.finished).length}</b></div><div class="stat"><span>Lifelines</span><b>${llTotal}</b></div></div>
  <section class="sec"><div class="sec-h"><h2>Race board</h2><span class="small muted">Tap a team to see or fix times</span></div>${raceBoard(rows)}</section>
  <div class="two">${spotWatch(openA)}<section class="sec"><div class="sec-h"><h2>Latest</h2><button class="btn sm ghost" data-act="tab" data-tab="act">Full log</button></div><div class="card">${feed(S.log.slice(0,6))}</div></section></div>`}

function spotWatch(openA){const noVol=S.spots.filter(s=>!s.volunteer).length;
  const items=S.spots.map(s=>{const st=stepsAtSpot(s.id);const heading=st.filter(x=>isLive()&&!x.t.withdrawn&&progress(x.t).next===x.step).length;
    return {s,st,heading,done:st.filter(x=>(x.t.checkins||{})[x.step]?.t).length,al:openA.some(a=>a.spotId===s.id)}});
  const row=x=>`<button class="li ${x.al?'is-bad':x.heading?'is-hot':''}" data-act="editSpot" data-id="${x.s.id}"><span class="no">${pad(x.s.no)}</span>
    <span class="grow"><span class="t ell">${esc(x.s.name)}</span><span class="s ell">${x.s.volunteer?esc(x.s.volunteer):'<span class="warn-t">No volunteer</span>'}</span></span>
    <span class="r"><span class="s num">${x.st.length?`${x.done}/${x.st.length}`:'—'}</span>${x.al?'<span class="pill bad">Alert</span>':x.heading?`<span class="pill gold">${x.heading} coming</span>`:''}</span></button>`;
  const busy=items.filter(x=>x.al||x.heading).sort((a,b)=>b.al-a.al||b.heading-a.heading),rest=items.filter(x=>!x.al&&!x.heading);
  if(!items.length)return `<section class="sec"><div class="sec-h"><h2>Spots</h2></div><div class="empty">No spots yet.</div></section>`;
  return `<section class="sec"><div class="sec-h"><h2>Spots</h2>${noVol?`<span class="pill warn">${noVol} without volunteer</span>`:''}</div>
   ${busy.length?`<div class="list">${busy.map(row).join('')}</div>`:''}
   <details class="card" data-k="dash-spots" ${openAttr('dash-spots',false)} style="padding:12px 14px"><summary>${busy.length?'Other spots':'All spots'} (${rest.length})</summary><div class="list" style="box-shadow:none">${rest.map(row).join('')}</div></details></section>`}

function feed(items){if(!items.length)return '<p class="muted small">Nothing logged yet.</p>';
  return `<ul class="feed">${items.map(l=>`<li><time>${fmtT(l.t)}</time><span>${l.type==='arrival'?'<span class="pill ok">Arrival</span> ':l.type==='lifeline'?'<span class="pill gold">Lifeline</span> ':l.type==='alert'?'<span class="pill bad">Alert</span> ':l.type==='undo'?'<span class="pill warn">Correction</span> ':''}${esc(l.text)}</span></li>`).join('')}</ul>`}

function aTeams(){const ts=[...S.teams].sort(byCode);
  return `<section class="sec"><div class="sec-h"><h2>Teams <span class="small muted">${ts.length}${S.meta.maxTeams?` of ${S.meta.maxTeams}`:''}</span></h2><span class="row"><button class="btn sm" data-act="bulkTeams">Add several</button><button class="btn pri sm" data-act="editTeam">${icon('plus')}Register a team</button></span></div>
  ${ts.length?`<div class="grid">${ts.map(t=>{const p=progress(t);const cap=(t.players||[])[t.captain||0]||{};const iss=routeIssues(t);const names=(t.players||[]).map(x=>x&&x.name).filter(Boolean);
    return `<article class="card stack" style="gap:8px"><div class="row sp"><span class="tname" style="min-width:0"><span class="sw" style="--c:${t.color}"></span><span class="ell">${esc(t.name)}</span></span><span class="pill">${esc(t.code||'')}</span></div>
    <div class="small"><b>Captain</b> ${esc(cap.name||'—')}${cap.phone?` · <a class="num" href="${esc(telHref(cap.phone))}">${esc(cap.phone)}</a>`:''}${names.length?`<div class="muted">${names.map(esc).join(' · ')}</div>`:'<div class="muted">No players added</div>'}</div>
    <ol class="route" aria-label="Route">${route(t).map((r,i)=>{const s=spotById(r.spotId);return `<li class="${s?'':'miss'}" title="Clue ${i+1}: ${esc(s?s.name:'not set')}">${s?pad(s.no):'?'}</li>`}).join('')}</ol>
    ${iss.map(x=>`<div class="small warn-t">⚠ ${esc(x)}</div>`).join('')}
    <div class="row sp"><span class="small muted">${p.solved}/${N()} solved · ${LL()-llUsed(t)} lifelines left${t.withdrawn?' · <b>Withdrawn</b>':''}</span>
    <span class="row"><button class="btn sm" data-act="progress" data-id="${t.id}">Progress</button><button class="btn sm" data-act="editTeam" data-id="${t.id}">Edit</button></span></div></article>`}).join('')}</div>`:'<div class="empty">No teams yet. Register your first team to start building routes.</div>'}</section>`}

function aSpots(){const sp=S.spots;
  return `<section class="sec"><div class="sec-h"><h2>Spots & volunteers <span class="small muted">${sp.length}</span></h2>
   <div class="row"><button class="btn sm" data-act="togglePins">${icon('eye')}${S.showPins?'Hide':'Show'} PINs</button><button class="btn pri sm" data-act="editSpot">${icon('plus')}Add</button></div></div>
  <p class="small muted">Each volunteer signs in with their spot's PIN and sees only the teams routed through that spot. Tap a spot to edit it.</p>
  ${sp.length?`<div class="list">${sp.map(s=>{const st=stepsAtSpot(s.id).sort((a,b)=>a.step-b.step);const byStep={};st.forEach(x=>{(byStep[x.step]=byStep[x.step]||[]).push(x.t)});
    const crowd=Object.entries(byStep).filter(([k,v])=>v.length>2);const pin=pinOf(s.id);
    return `<button class="li" data-act="editSpot" data-id="${s.id}"><span class="no">${pad(s.no)}</span>
    <span class="grow"><span class="t ell">${esc(s.name)}</span>
     <span class="s ell">${s.volunteer?esc(s.volunteer):'<span class="warn-t">Unassigned</span>'}${s.volunteer2?' + '+esc(s.volunteer2):''}${s.phone?' · <span class="num">'+esc(s.phone)+'</span>':''}</span>
     <span class="s ell">${st.length?st.map(x=>`${esc(x.t.code||x.t.name)} #${x.step}`).join(' · '):'Not on any route'}</span>
     ${crowd.map(([k,v])=>`<span class="s warn-t">${v.length} teams arrive as clue #${k}; consider staggering.</span>`).join('')}</span>
    <span class="r"><span class="num small ${pin?'':'warn-t'}">${pin?(S.showPins?esc(pin):'••••••'):'No PIN'}</span>
     <span class="row" style="gap:4px">${s.clue?'<span class="pill ok">Clue</span>':'<span class="pill warn">Clue</span>'}${s.hint?'<span class="pill ok">Hint</span>':'<span class="pill warn">Hint</span>'}${s.lat!=null?'<span class="pill ok">Map</span>':'<span class="pill">Map</span>'}</span></span></button>`}).join('')}</div>
  <div class="row"><button class="btn sm" data-act="genPins">Create missing PINs</button><button class="btn sm danger" data-act="genPins" data-all="1" data-confirm="Tap again: every volunteer needs a new PIN">Replace all spot PINs</button></div>`:'<div class="empty">No spots yet.</div>'}</section>`}

function aLife(){const ts=ranked();const hist=S.teams.flatMap(t=>llList(t).filter(Boolean).map(l=>({t,l}))).sort((a,b)=>b.l.t-a.l.t);
  const reqs=S.alerts.filter(a=>!a.resolved&&a.kind==='hint');
  return `${reqs.length?`<section class="sec"><div class="sec-h"><h2>Hint requests waiting</h2></div>${reqs.map(a=>{const t=teamById(a.teamId);return `<div class="card hl-gold stack" style="gap:8px"><div class="row sp"><b>${esc(t?t.name:'Team')} · clue #${a.clue}</b><span class="num small">${fmtT(a.t)}</span></div><div class="small">${esc(spotLabel(a.spotId))}${a.by?' · '+esc(a.by):''}${a.msg?' · '+esc(a.msg):''}</div><div class="row">${t?`<button class="btn sm gold" data-act="hint" data-id="${t.id}" data-alert="${a.id}">Send hint</button>`:''}<button class="btn sm" data-act="resolve" data-id="${a.id}">Reply without hint</button></div></div>`}).join('')}</section>`:''}
  <section class="sec"><div class="sec-h"><h2>Lifelines</h2></div><p class="small muted">When a team calls in, open their current clue and read out the hint. One lifeline is used per hint.</p>
  ${ts.length?`<div class="list">${ts.map(({t,p})=>{const left=LL()-llUsed(t);return `<div class="li"><span class="grow"><span class="t"><span class="sw" style="--c:${t.color}"></span><span class="ell">${esc(t.name)}</span></span>
    <span class="s ell">${p.finished?'<span class="pill ok">Finished</span>':`Clue <b class="num">#${p.next}</b> → ${esc(spotLabel(route(t)[p.next-1].spotId))}`}</span></span>
    <span class="r"><span class="row" style="gap:6px">${dots(t)}<span class="num small">${left}/${LL()}</span></span><button class="btn sm ${left&&!p.finished?'gold':''}" data-act="hint" data-id="${t.id}" ${p.finished?'disabled':''}>${left?'Give hint':'View clue'}</button></span></div>`}).join('')}</div>`:'<div class="empty">No teams yet.</div>'}</section>
  <details class="card sec" data-k="ll-hist" ${openAttr('ll-hist',false)}><summary>Lifeline history (${hist.length})</summary>${hist.length?`<div class="list" style="box-shadow:none">${hist.map(({t,l})=>`<div class="li"><span class="num small muted">${fmtT(l.t)}</span>
   <span class="grow"><span class="t"><span class="sw" style="--c:${t.color}"></span><span class="ell">${esc(t.name)}</span> <span class="num small">#${l.clue}</span></span>${l.note?`<span class="s">${esc(l.note)}</span>`:''}</span>
   <button class="btn sm danger" data-act="undoLL" data-id="${t.id}" data-slot="${l.slot}" data-confirm="Tap again to return it">Return</button></div>`).join('')}</div>`:'<p class="small muted">No lifelines used yet.</p>'}</details>`}

function aAct(){const open=S.alerts.filter(a=>!a.resolved),closed=S.alerts.filter(a=>a.resolved).slice(0,10);
  return `<div class="two"><div><section class="sec"><div class="sec-h"><h2>Open alerts</h2></div>
   ${open.length?open.map(a=>`<div class="card hl-bad stack" style="gap:6px"><div class="row sp"><b>${esc(a.type)}</b><span class="num small">${fmtT(a.t)}</span></div>
     <div class="small">${esc(spotLabel(a.spotId))}${a.by?` · ${esc(a.by)}`:''}</div>${a.msg?`<div class="muted">${esc(a.msg)}</div>`:''}
     ${a.kind==='hint'&&teamById(a.teamId)?`<div class="small">${esc(teamById(a.teamId).name)} · clue #${a.clue} · ${dots(teamById(a.teamId))} ${LL()-llUsed(teamById(a.teamId))} left</div>`:''}
     <div class="row">${a.kind==='hint'?`<button class="btn sm gold" data-act="hint" data-id="${a.teamId}" data-alert="${a.id}">Send hint</button>`:''}<button class="btn sm ${a.kind==='hint'?'':'pri'}" data-act="resolve" data-id="${a.id}">${a.kind==='hint'?'Reply without hint':'Resolve with note'}</button></div></div>`).join(''):'<div class="empty">No open alerts.</div>'}
   ${closed.length?`<details class="card" data-k="act-closed" ${openAttr('act-closed',false)}><summary class="small">Resolved (${closed.length})</summary><ul class="feed">${closed.map(a=>`<li><time>${fmtT(a.t)}</time><span>${esc(spotLabel(a.spotId))} · ${esc(a.type)} ${esc(a.msg||'')}${a.reply?` → <b>${esc(a.reply.hint!=null?(a.reply.hint?'Hint sent: '+a.reply.hint:'Hint sent (no hint text)'):a.reply.note||'Resolved')}</b>`:''}${a.ack?' <span class="pill ok">Seen</span>':''}</span></li>`).join('')}</ul></details>`:''}</section>
   <form class="card stack sec" data-form="broadcast"><div><h3>Message all volunteers</h3><p class="small muted">Shows as a banner on every volunteer's screen until you clear it.</p></div>
    <textarea id="bc-msg" placeholder="e.g. Rain at Manek Chowk. Hold teams under the arcade for 10 minutes.">${esc(S.meta.broadcast?.msg||'')}</textarea>
    <div class="row"><button class="btn pri" type="submit">Send to volunteers</button>${S.meta.broadcast?.msg?'<button class="btn" type="button" data-act="clearBc">Clear banner</button>':''}</div></form></div>
  <section class="sec"><div class="sec-h"><h2>Activity log</h2><span class="small muted">Last ${S.log.length}</span></div><div class="card">${feed(S.log)}</div></section></div>`}

function aSet(){const m=S.meta;const st=m.status||'setup';const adminPins=S.pins.filter(p=>p.role==='admin');
  return `<div class="two"><form class="stack sec" data-form="settings">
   <details class="card" data-k="set-ev" ${openAttr('set-ev',true)}><summary>Event details</summary><div class="fgrid">
    <label class="f full">Event name<input type="text" id="set-name" value="${esc(m.name||'')}"></label>
    <label class="f">Date<input type="date" id="set-date" value="${esc(m.date||'')}"></label>
    <label class="f">Start time<input type="time" id="set-stime" value="${esc(m.startTime||'')}"></label>
    <label class="f">Series / edition<input type="text" id="set-series" value="${esc(m.series||'')}" placeholder="e.g. Zonal Meet 1.0"></label>
    <label class="f">Venue<input type="text" id="set-venue" value="${esc(m.venue||'')}"></label>
    <label class="f full">Presented by<input type="text" id="set-presenter" value="${esc(m.presenter||'')}"></label>
    <label class="f full">Tagline<input type="text" id="set-tagline" value="${esc(m.tagline||'')}"></label>
    <label class="f full">Motto<input type="text" id="set-motto" value="${esc(m.motto||'')}"></label>
    <label class="f full">Hosted by (one per line)<textarea id="set-hosts">${esc(m.hosts||'')}</textarea></label></div></details>
   <details class="card" data-k="set-course" ${openAttr('set-course',false)}><summary>Course & rules</summary><div class="fgrid">
    <label class="f">Start point<input type="text" id="set-spoint" value="${esc(m.startPoint||'')}" placeholder="Where teams collect clue #1"></label>
    <label class="f">Finish point<input type="text" id="set-finish" value="${esc(m.finish||'')}" placeholder="Where teams report after the last clue"></label>
    <label class="f">Clues to finish<input type="number" id="set-clues" min="1" max="15" value="${N()}"></label>
    <label class="f">Lifelines per team<input type="number" id="set-ll" min="0" max="10" value="${LL()}"></label>
    <label class="f">Team limit<input type="number" id="set-max" min="1" max="100" value="${esc(m.maxTeams||16)}"></label>
    <label class="full small" style="display:flex;gap:10px;align-items:flex-start;font-weight:600"><input type="checkbox" id="set-live" style="margin-top:4px" ${m.liveSpots!==false?'checked':''}><span>Show reached spots on the public scoreboard during the hunt<span class="muted" style="display:block;font-weight:400">Spot names and the map show only places a team has already reached. Turn this off if people might pass them on to teams.</span></span></label></div></details>
   <details class="card" data-k="set-ph" ${openAttr('set-ph',false)}><summary>Control room phones</summary><div class="fgrid">
    <label class="f">Main phone<input type="tel" id="set-phone" value="${esc(m.phone||'')}"></label>
    <label class="f">Backup phone<input type="tel" id="set-phone2" value="${esc(m.phone2||'')}"></label></div></details>
   <div><button class="btn pri" type="submit">Save details</button></div></form>
  <div class="stack sec">
   <div class="card stack"><h3>Event clock</h3>
    <p class="small">Status: <b>${st==='live'?'Live':st==='ended'?'Ended':'Not started'}</b>${m.startedAt?` · started ${fmtT(m.startedAt)}`:''}${m.endedAt?` · ended ${fmtT(m.endedAt)}`:''}</p>
    <div class="row">${st!=='live'?`<button class="btn gold" data-act="start">${m.startedAt?'Resume (keep start time)':'Start the hunt now'}</button>`:`<button class="btn danger" data-act="end" data-confirm="Tap again to end the hunt">End the hunt</button>`}</div>
    <label class="f">Correct the start time<span class="row"><input type="time" id="set-start" style="max-width:150px" value="${m.startedAt?fmtHM(m.startedAt):''}"><button class="btn sm" type="button" data-act="setStart">Apply</button></span></label></div>
   <form class="card stack" data-form="adminPin"><div class="row sp"><h3>Admin PIN</h3><button class="btn sm ghost" type="button" data-act="togglePins">${icon('eye')}${S.showPins?'Hide':'Show'}</button></div>
    <p class="small muted">Current: <span class="num">${adminPins.length?adminPins.map(p=>S.showPins?esc(p.id):'••••••').join(', '):'—'}</span>. Changing it signs out every other control-room device.</p>
    <label class="f">New admin PIN (6–12 digits)<input type="password" inputmode="numeric" id="ap-new" autocomplete="new-password" maxlength="12"></label>
    <div><button class="btn" type="submit">Change admin PIN</button></div><span class="err" id="ap-err"></span></form>
   <div class="card stack"><h3>Results & data</h3>
    <p class="small muted">Download standings with every arrival time and lifeline as a spreadsheet file (CSV).</p>
    <div><button class="btn" data-act="csv">Download results CSV</button></div>
    <textarea id="csv-out" hidden readonly style="min-height:120px;font-family:var(--mono);font-size:12px"></textarea>
    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:0">
    <p class="small muted">After a rehearsal: clears every arrival and lifeline, all alerts and hint requests, the volunteer banner and the activity log, and resets the clock. Teams, routes and spots stay.</p>
    <div><button class="btn danger" data-act="reset" data-confirm="Tap again to clear all progress">Reset all progress</button></div></div>
   <p class="small muted">Only people with a PIN can see spots, routes, clues and phone numbers. The public sees event details and the scoreboard only.</p></div></div>`}

/* ---------- volunteer ---------- */
function vVol(){const s=spotById(S.spotId);if(!s)return `<div class="empty narrow">This spot no longer exists. <button class="btn sm" data-act="logout">Sign out</button></div>`;
  const items=stepsAtSpot(s.id).map(x=>{const p=progress(x.t);const c=(x.t.checkins||{})[x.step];
    const state=c&&c.t?'arrived':x.t.withdrawn?'out':p.next===x.step&&isLive()?'here':p.next!=null&&p.next<x.step?'later':'passed';return {...x,p,c,state}});
  const order={here:0,later:1,arrived:2,passed:3,out:4};items.sort((a,b)=>order[a.state]-order[b.state]||a.step-b.step||(b.c?.t||0)-(a.c?.t||0));
  const n=k=>items.filter(i=>i.state===k).length;
  const grp=(label,list)=>list.length?`<p class="grp-h">${label}</p>${list.map(volCard).join('')}`:'';
  return `<div class="narrow">
  <div class="vhead"><span class="eyebrow">Spot ${pad(s.no)}</span><h2>${esc(s.name)}</h2>
   <span class="small muted">${esc(s.volunteer||'Volunteer')}${s.volunteer2?' & '+esc(s.volunteer2):''}${s.area?' · '+esc(s.area):''}</span></div>
  <div class="stack">
   ${!isLive()?`<div class="card hl-warn small">${S.meta.status==='ended'?'The hunt has ended. Thank you!':'The hunt has not started yet. Teams below will reach you once the control room starts the clock.'}</div>`:''}
   ${volMsgs()}
   ${volGuide()}
   ${s.notes?`<div class="card small"><b>Note from control room:</b> ${esc(s.notes)}</div>`:''}
  </div>
  <div class="seg" style="margin-top:14px"><span class="hot"><b>${n('here')}</b>coming now</span><span><b>${n('later')}</b>still to come</span><span><b>${n('arrived')}</b>arrived</span></div>
  <div class="stack">
   ${items.length?grp('Coming now',items.filter(x=>x.state==='here'))+grp('Still to come',items.filter(x=>x.state==='later'))+grp('Arrived',items.filter(x=>x.state==='arrived'))+grp('Other',items.filter(x=>x.state==='passed'||x.state==='out')):'<div class="empty">No team is routed through this spot yet. The control room assigns routes.</div>'}
   ${items.length?`<details class="card" data-k="vol-ov" ${openAttr('vol-ov',false)}><summary>All teams at this spot</summary><div class="tablewrap"><table><thead><tr><th>Team</th><th class="c">Arrives with</th><th class="c">Hand over</th><th>Status</th></tr></thead><tbody>
    ${[...items].sort((a,b)=>a.step-b.step).map(x=>`<tr><td><span class="tname"><span class="sw" style="--c:${x.t.color}"></span>${esc(x.t.name)}</span></td><td class="c num"><b>#${x.step}</b></td>
     <td class="c num">${x.step===N()?'<span class="pill ok">Finish</span>':`<b>#${x.step+1}</b>`}</td><td>${x.state==='arrived'?`<span class="pill ok">${fmtT(x.c.t)}</span>`:x.state==='here'?'<span class="pill gold">Coming now</span>':'<span class="pill">Waiting</span>'}</td></tr>`).join('')}
    </tbody></table></div></details>`:''}
   ${contactCard()}
  </div></div>`}
function telHref(n){return 'tel:'+String(n).replace(/[^\d+]/g,'')}
function contactCard(){const ph=[S.meta.phone,S.meta.phone2].filter(Boolean);
  return `<div class="card contact stack" style="gap:8px"><span class="eyebrow">Control room</span>
   ${ph.length?ph.map((n,i)=>`<div class="row sp"><span><span class="ph">${esc(n)}</span>${ph.length>1?`<span class="small muted"> · ${i?'backup':'main'}</span>`:''}</span>
     <span class="row"><a class="btn sm ${i?'':'gold'}" href="${esc(telHref(n))}">${icon('phone')}Call</a><button class="btn sm" data-act="copy" data-text="${esc(n)}">Copy</button></span></div>`).join(''):'<p class="small">Phone number not added yet. Send an alert instead.</p>'}</div>`}
function volMsgs(){const mine=S.alerts.filter(a=>a.spotId===S.spotId);if(!mine.length)return '';
  const fresh=mine.filter(a=>a.resolved&&a.reply&&!a.ack),wait=mine.filter(a=>!a.resolved),done=mine.filter(a=>a.resolved&&!(a.reply&&!a.ack)).slice(0,8);
  const tn=a=>a.teamId&&teamById(a.teamId)?teamById(a.teamId).name:'';
  return `${fresh.map(a=>a.reply.hint!=null?`<div class="msg hint"><span class="lbl">Hint from control room · ${esc(tn(a))} · clue #${a.clue} · ${fmtT(a.reply.t)}</span>
     <div class="body">${esc(a.reply.hint||a.reply.note||'(No hint text)')}</div>${a.reply.hint&&a.reply.note?`<div class="small"><b>Note:</b> ${esc(a.reply.note)}</div>`:''}
     <div><button class="btn pri" data-act="ack" data-id="${a.id}">Shared with the team</button></div></div>`:
    `<div class="msg"><span class="lbl">Control room replied · ${esc(a.type)}${tn(a)?' · '+esc(tn(a)):''} · ${fmtT(a.reply.t)}</span>
     <div class="body">${esc(a.reply.note||'Resolved.')}</div><div><button class="btn pri" data-act="ack" data-id="${a.id}">Got it</button></div></div>`).join('')}
  ${wait.map(a=>`<div class="msg wait"><span class="lbl" style="color:var(--ink2)">Waiting for control room · sent ${fmtT(a.t)}</span><div class="small">${esc(a.type)}${tn(a)?' · '+esc(tn(a)):''}${a.clue?' · clue #'+a.clue:''}${a.msg?' · '+esc(a.msg):''}</div></div>`).join('')}
  ${done.length?`<details class="card" data-k="vol-done" ${openAttr('vol-done',false)}><summary class="small">Earlier messages (${done.length})</summary><ul class="feed">${done.map(a=>`<li><time>${fmtT(a.t)}</time><span>${esc(a.type)}${tn(a)?' · '+esc(tn(a)):''}${a.reply?(a.reply.hint!=null?' · Hint: '+esc(a.reply.hint):' · '+esc(a.reply.note||'')):' · Resolved'}</span></li>`).join('')}</ul></details>`:''}`}
function volCard(x){const {t,step,c,state}=x;const last=step===N();
  const status=state==='arrived'?`<span class="pill ok">Arrived ${fmtT(c.t)}</span>`:state==='here'?'<span class="pill gold live">Solving your clue now</span>':state==='later'?`<span class="pill">On clue #${x.p.next}</span>`:state==='out'?'<span class="pill">Withdrawn</span>':'<span class="pill warn">Skipped this spot?</span>';
  const canUndo=state==='arrived'&&c.by===S.spotId&&Date.now()-(c.at||c.t)<10*60e3;
  const canMark=state==='here'||(state!=='arrived'&&state!=='out'&&x.p.next===step);
  const hand=state==='arrived'?(last?`<div class="handover"><span class="lbl">Final spot</span><p><b>${esc(t.name)} has finished the hunt.</b> Send them to ${esc(S.meta.finish||'the finish point')}.</p></div>`:
    `<div class="handover"><span class="lbl">Hand over clue #${step+1}</span><p>${clueOf(t,step+1)?esc(clueOf(t,step+1)):'<span class="muted">No clue text entered. Use the physical card numbered #'+(step+1)+' for this team.</span>'}</p></div>`):'';
  const actions=[canMark?`<button class="btn pri big" data-act="arrive" data-id="${t.id}" data-step="${step}">Mark arrived</button>`:'',
    !x.p.finished&&!t.withdrawn&&(state==='arrived'||state==='passed')?`<button class="btn sm gold" data-act="reqHint" data-id="${t.id}">Request hint · clue #${x.p.next}</button>`:'',
    canUndo?`<button class="btn sm danger" data-act="volUndo" data-id="${t.id}" data-step="${step}" data-confirm="Tap again to undo">Undo arrival</button>`:''].filter(Boolean);
  return `<article class="vteam ${state==='here'?'here':''}" style="--c:${t.color}">
   <div class="row sp" style="flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><h3 class="ell">${esc(t.name)}</h3><span class="small muted">${esc(t.code||'')} · captain ${esc(((t.players||[])[t.captain||0]||{}).name||'—')}</span></div>
   <div class="arr"><div class="small muted">Arrives with</div><div class="bigclue">#${step}</div></div></div>
   <div class="row">${status}${dots(t)}</div>
   ${state==='later'?`<div class="handover warn"><span class="lbl">Can't mark arrival yet</span>
    <p>${esc(t.name)} has not solved clue #${x.p.next} yet. Don't hand over any clue. Ask them to keep solving and let the control room know.</p>
    <div><button class="btn sm" data-act="outOfOrder" data-id="${t.id}" data-step="${step}">Tell control room they came early</button></div></div>`:''}
   ${hand}${actions.length?`<div class="row">${actions.join('')}</div>`:''}</article>`}

function volGuide(){const fin=S.meta.finish||'the finish point';
  return `<details class="card" data-k="vol-guide" ${openAttr('vol-guide',lsGet('hh.vguideClosed')!==true)}><summary>Volunteer guide</summary>
  ${flow([`<b>Keep this page open.</b> Every team routed through your spot is listed below. A team moves to <b>Coming now</b> while it is solving the clue that leads to you.`,
    `<b>When a team arrives,</b> check its name and colour, then tap <b>Mark arrived</b>. The arrival time is saved straight away.`,
    `<b>Hand over the next clue</b> shown on the team's card (or the printed card with that number). At the last spot, send the team to ${esc(fin)}.`,
    `<b>Team came too early?</b> If the card says <b>Can't mark arrival yet</b>, don't give any clue. Tap <b>Tell control room they came early</b>.`,
    `<b>Team stuck?</b> Tap <b>Hint</b> at the bottom and choose the team. When the control room replies, the hint appears here: read it out, then tap <b>Shared with the team</b>.`,
    `<b>Problem or emergency?</b> Tap <b>Alert</b>, or <b>Call</b> to phone the control room.`,
    `<b>Made a mistake?</b> Tap <b>Undo arrival</b> within 10 minutes, or call the control room.`,
    `<b>No network?</b> Keep going. Arrivals are saved on your phone and sync by themselves when the signal returns.`])}
  <p class="small muted" style="margin-top:10px">Tap the heading to hide this guide. It stays hidden on this phone.</p></details>`}
const flow=items=>`<ol class="flow">${items.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;

/* ---------- scoreboard ---------- */
const shortTag=t=>String(t.code||'').replace(/^[A-Za-z]+0*/,'')||String(t.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function fmtSplit(ms){const m=Math.round(ms/60000);return m<60?`${m} min`:`${Math.floor(m/60)} h ${pad(m%60)}`}
function fmtAgo(ms){const m=Math.floor(ms/60000);return m<1?'just now':m<60?`${m} min ago`:`${Math.floor(m/60)} h ${m%60} min ago`}
function vBoard(){const rows=ranked(S.board);const tab=S.boardTab||'stand';const fin=rows.filter(r=>r.p.finished).length;
  const body=tab==='trail'?bTrail(rows):tab==='map'?bMap(rows):bStand(rows);
  return `${logoBand('lg')}
  <div class="bhead"><div><h2>Live scoreboard</h2><p class="small muted">${rows.length} teams · ${fin} finished${isLive()?' · updates live':''}</p></div>
   <div class="btabs" role="tablist">${[['stand','Standings'],['trail','Trail'],['map','Map']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="btab" data-tab="${k}">${l}</button>`).join('')}</div></div>
  <div class="bgrid ${tab==='map'?'full':''}"><div>${body}</div>${tab==='map'?'':`<aside>${bTicker()}</aside>`}</div>`}
function lbItem(r,i,open){const {t,p}=r;
  return `<div class="lbitem ${open?'open':''}"><button class="lbrow" data-act="bsel" data-id="${t.id}" aria-expanded="${open}">
   <span class="rk ${i===0&&p.finished?'first':''}">${i+1}</span>
   <span style="min-width:0;display:block"><span class="tname"><span class="sw" style="--c:${t.color}"></span><span class="ell">${esc(t.name)}</span>${p.finished?'<span class="pill ok">Finished</span>':''}</span>
    ${(t.players||[]).length?`<span class="small muted ell" style="display:block">${t.players.map(esc).join(' · ')}</span>`:''}${pipsBar(t,p)}</span>
   <span class="tm">${timeCell(t,p)}<span class="small muted" style="display:block">${!p.finished&&p.next&&isLive()&&!t.withdrawn?`On clue #${p.next}`:`${p.solved}/${N()}`} · ${dots(t)}</span></span></button>
   ${open?teamDetail(t,p):''}</div>`}
function teamDetail(t,p){const st=startOf(t);const ck=t.checkins||{};const trail=new Map((t.trail||[]).map(x=>[x.clue,x]));let prev=st;
  let left=0;const items=range(N()).map(i=>{const c=ck[i];const sp=trail.get(i);
    if(c&&c.t){const split=prev?c.t-prev:null;prev=c.t;
      return `<li class="done"><span class="n">#${i}</span><span class="ell">${sp&&sp.name?esc(sp.name):i===N()?'Final spot':'Spot reached'}</span><span class="num">${fmtT(c.t)}</span><span class="num small muted r">${split!=null?'+'+fmtSplit(split):''}</span></li>`}
    const now=p.next===i&&isLive()&&!t.withdrawn;const since=now?prev:null;prev=null;
    if(now)return `<li class="now"><span class="n">#${i}</span><span>Solving now</span><span class="num" ${since?`data-since="${since}"`:''}></span><span></span></li>`;
    left++;return ''}).join('');
  const pl=t.players||[];
  return `<div class="tdetail">
   ${pl.length?`<div class="small"><b>Players</b> ${pl.map(n=>esc(n)+(n===t.captain?' <span class="pill gold">Captain</span>':'')).join(' · ')}</div>`:''}
   <div class="row small muted">${st?`<span>Started ${fmtT(st)}</span>`:'<span>Not started</span>'}${p.finished?`<span>· Finished ${fmtT(p.last)} in <b class="num">${fmtDur(p.last-st)}</b></span>`:''}<span>· ${llUsed(t)} of ${LL()} lifelines used</span></div>
   ${items?`<ol class="tl">${items}</ol>`:''}${left?`<p class="small muted">${p.solved?`${left} more clue${left>1?'s':''} to go`:`No arrivals yet · ${N()} clues to go`}</p>`:''}</div>`}
function bStand(rows){if(!rows.length)return '<div class="empty">No teams yet.</div>';
  return `<div class="lb">${rows.map((r,i)=>lbItem(r,i,S.boardSel===r.t.id)).join('')}</div><p class="small muted" style="margin-top:8px">Tap a team to see its players and the time at every clue.</p>`}
function selCard(rows){const i=rows.findIndex(r=>r.t.id===S.boardSel);return i<0?'':`<div style="margin-top:12px">${lbItem(rows[i],i,true)}</div>`}
function bTrail(rows){if(!rows.length)return '<div class="empty">No teams yet.</div>';
  const cols=N()+1;
  return `<div class="card"><div class="trailwrap"><div class="trail" style="--n:${cols}">${range(cols).map(j=>{const k=j-1;const here=rows.filter(r=>Math.min(r.p.solved,N())===k);
    return `<div class="stn ${k===N()?'fin':''}"><div class="toks">${here.map(r=>`<button class="tok ${r.t.id===S.boardSel?'sel':''} ${isLive()&&!r.p.finished?'moving':''}" style="--c:${r.t.color};color:${inkOn(r.t.color)}" data-act="bsel" data-id="${r.t.id}" title="${esc(r.t.name)}" aria-label="${esc(r.t.name)}">${esc(shortTag(r.t))}</button>`).join('')}</div>
     <span class="dot"></span><span class="lbl">${k===0?'Start':k===N()?'Finish':'#'+k}</span></div>`}).join('')}</div></div>
   <p class="small muted" style="margin-top:6px">Each token is a team, shown at the last clue it reached. ${revealSpots()?'Spots appear only after a team has reached them.':'Spot names stay hidden until the hunt ends.'} Tap a token for details.</p></div>
  ${selCard(rows)}`}
function bMap(rows){
  if(!revealSpots())return `<div class="card maplock">${icon('lock')}<div><b>The map opens when the hunt ends</b><p class="small muted">Showing spot locations now would give the routes away. Follow the race on the Trail tab.</p></div></div>`;
  if(!rows.some(r=>(r.t.trail||[]).length))return '<div class="empty">Each team\'s route appears here as it reaches its spots.</div>';
  if(!rows.some(r=>(r.t.trail||[]).some(x=>x.lat!=null)))return '<div class="empty">No spot locations yet. Organisers can add a map location to each spot in the control room (Spots, then edit a spot).</div>';
  return `<div class="maplegend">${rows.map(r=>`<button class="chip ${S.boardSel===r.t.id?'sel':''}" data-act="bsel" data-id="${r.t.id}" style="--c:${r.t.color}"><span class="sw"></span>${esc(r.t.name)}</button>`).join('')}</div>
  <div id="map-ph" class="map"></div>${selCard(rows)}`}
function bTicker(){const ev=[];
  for(const t of S.board){if(t.withdrawn)continue;for(const k in t.checkins||{}){const c=t.checkins[k];if(c&&c.t)ev.push({t,k:+k,ts:c.t})}for(const k in t.lifelines||{}){const l=t.lifelines[k];if(l&&l.t)ev.push({t,ll:true,ts:l.t})}}
  ev.sort((a,b)=>b.ts-a.ts);
  return `<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Latest</h3>${ev.length?`<ul class="ticker">${ev.slice(0,8).map(e=>`<li><span class="sw" style="--c:${e.t.color}"></span>
   <span class="grow"><b>${esc(e.t.name)}</b> ${e.ll?'used a lifeline':e.k===N()?'finished the hunt':`reached ${(()=>{const x=(e.t.trail||[]).find(y=>y.clue===e.k);return x&&x.name?esc(x.name)+' (clue #'+e.k+')':'clue #'+e.k})()}`}</span><span class="small muted ago" data-ago="${e.ts}">${fmtAgo(Date.now()-e.ts)}</span></li>`).join('')}</ul>`
   :'<p class="small muted">Arrivals appear here as teams reach their spots.</p>'}</div>`}

/* Map (after the hunt): one Leaflet map kept alive across re-renders. */
const LEAFLET={js:['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js','sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH'],
  css:['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css','sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H']};
let MAP=null,leafP=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(leafP)return leafP;
  leafP=new Promise((res,rej)=>{const c=document.createElement('link');c.rel='stylesheet';c.href=LEAFLET.css[0];c.integrity=LEAFLET.css[1];c.crossOrigin='anonymous';document.head.appendChild(c);
    const s=document.createElement('script');s.src=LEAFLET.js[0];s.integrity=LEAFLET.js[1];s.crossOrigin='anonymous';s.onload=res;s.onerror=()=>{leafP=null;rej()};document.head.appendChild(s)});return leafP}
function mountMap(){const ph=document.getElementById('map-ph');if(!ph)return;
  if(!MAP){const el=document.createElement('div');el.className='map';MAP={el,key:''}}ph.replaceWith(MAP.el);
  loadLeaflet().then(()=>{if(!MAP.map){MAP.map=L.map(MAP.el,{scrollWheelZoom:false});
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors',referrerPolicy:'strict-origin-when-cross-origin'}).addTo(MAP.map);
      MAP.group=L.layerGroup().addTo(MAP.map)}
    setTimeout(()=>MAP.map.invalidateSize(),0);drawMap()})
   .catch(()=>{MAP.el.innerHTML='<p class="small muted" style="padding:16px">The map could not load. Check the internet connection and reload.</p>'})}
function drawMap(){const rows=ranked(S.board).sort((a,b)=>(a.t.id===S.boardSel)-(b.t.id===S.boardSel));
  const key=stable({tr:rows.map(r=>[r.t.id,r.t.color,r.t.trail||null]),sel:S.boardSel||''});if(key===MAP.key)return;MAP.key=key;MAP.group.clearLayers();const pts=[];
  for(const {t} of rows){const tr=(t.trail||[]).filter(x=>x.lat!=null&&x.lng!=null);if(!tr.length)continue;const dim=!!S.boardSel&&S.boardSel!==t.id;const ll=tr.map(x=>[x.lat,x.lng]);pts.push(...ll);
    L.polyline(ll,{color:t.color,weight:dim?2:4,opacity:dim?.25:.9}).addTo(MAP.group);
    tr.forEach(x=>L.circleMarker([x.lat,x.lng],{radius:dim?4:7,color:'#fff',weight:2,fillColor:t.color,fillOpacity:dim?.35:1})
      .bindTooltip(`<b>${esc(t.name)}</b> · clue #${x.clue}<br>${esc(x.name||'')} · ${fmtT(x.t)}`).addTo(MAP.group))}
  if(pts.length&&pts.length!==MAP.fitN){MAP.map.fitBounds(pts,{padding:[30,30],maxZoom:17});MAP.fitN=pts.length}}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

   <fieldset><legend>Players</legend>${range(4).map(i=>`<div class="player">

   <fieldset><legend>Route: ${N()} clues</legend><p class="hintline">Clue #n leads the team to spot n. Clue #1 is handed out at the start; the volunteer at spot n hands over clue #n+1. Clue text and hints come from the spot unless you set a custom one.</p>

     <textarea id="tm-c${i}" placeholder="Leave blank to use the spot's clue" style="min-height:48px">${esc(r.clue||'')}</textarea>

function asgNote(teamId,step,spotId){const t=teamById(teamId);if(!t||!step)return '';const cur=route(t)[step-1].spotId;
  const other=route(t).findIndex(r=>r.spotId===spotId);let n='';
  if(cur&&cur!==spotId)n=`Replaces ${spotLabel(cur)} as clue #${step}.`;
  if(other>=0&&other+1!==step)n+=` Moves from clue #${other+1}.`;
  if((t.checkins||{})[step]?.t)n+=' This clue already has an arrival recorded.';return n.trim()}

/* ---------- access (PINs) ---------- */
function genPin(taken){taken=taken||new Set(S.pins.map(p=>p.id));let p;
  do{const a=new Uint32Array(1);crypto.getRandomValues(a);p=String(a[0]%1e6).padStart(6,'0')}while(taken.has(p)||/^(\d)\1+$/.test(p)||'0123456789'.includes(p)||'9876543210'.includes(p));return p}
/* Returns '' on success, otherwise the message to show. */
async function signInWithPin(pin,want){const fs=S.fs;
  const u=S.auth.currentUser||(await S.auth.signInAnonymously()).user;
  const snap=await fs.doc('pins/'+pin).get();let d=snap.exists?snap.data():null;
  if(!d&&want==='admin'){try{await fs.doc('pins/'+pin).set({role:'admin'});d={role:'admin'}}catch(e){}} // one-time upgrade from the old admin PIN
  if(!d)return want==='admin'?'That PIN is not right.':'That PIN does not match any spot.';
  if(d.role!==want)return want==='admin'?'That is a spot PIN. Use the Spot volunteer box.':'That is the admin PIN. Use the Control room box.';
  await fs.doc('grants/'+u.uid).set({pin,role:d.role,spotId:d.spotId||null,t:Date.now()});
  enterRole(d.role,d.spotId||null);return ''}
async function pinLogin(f,want,inSel,errSel){const pin=$(inSel).value.trim();const err=$(errSel),btn=f.querySelector('button[type=submit]');err.textContent='';
  if(!/^\d{4,12}$/.test(pin)){err.textContent='Enter the number PIN you were given.';return}
  if(!S.fs){err.textContent='Not connected to the database.';return}
  const label=btn.textContent;btn.disabled=true;btn.textContent='Checking…';
  try{const msg=await signInWithPin(pin,want);if(msg)err.textContent=msg}
  catch(e){console.error(e);const c=e&&e.code||'';err.textContent=/operation-not-allowed|admin-restricted/.test(c)?'Sign-in is switched off in Firebase. Turn on Anonymous sign-in (see the setup guide).':/network/.test(c)||c==='unavailable'?'No connection. Check your internet and try again.':'Could not sign in. Try again.'}
  if(document.body.contains(btn)){btn.disabled=false;btn.textContent=label}}
function enterRole(role,spotId){S.role=role;S.spotId=spotId||null;if(role==='vol')S.tab='dash';lsSet('hh.session',{role,tab:S.tab});
  if(role==='admin'||role==='vol')listen();render({fresh:true});window.scrollTo(0,0)}
function stopListen(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];['spots','teams','alerts','log','pins'].forEach(k=>S.loaded[k]=false);
  S.spots=[];S.teams=[];S.alerts=[];S.log=[];S.pins=[];S.seen=new Set()}
function listen(){stopListen();const fs=S.fs;const add=(q,cb)=>S.unsubs.push(q.onSnapshot(cb,onStaffErr));
  add(fs.collection('spots'),s=>{S.spots=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(+a.no||0)-(+b.no||0));changed('spots')});
  add(fs.collection('teams'),s=>{S.teams=s.docs.map(d=>({...d.data(),id:d.id}));changed('teams');scheduleReconcile()});
  add(fs.collection('alerts').orderBy('t','desc').limit(60),onAlerts);
  if(S.role==='admin'){
    add(fs.collection('log').orderBy('t','desc').limit(150),s=>{S.log=s.docs.map(d=>({...d.data(),id:d.id}));changed('log')});
    add(fs.collection('pins'),s=>{S.pins=s.docs.map(d=>({...d.data(),id:d.id}));changed('pins')})}}
function onAlerts(s){const before=S.alerts.filter(a=>!a.resolved).length;S.alerts=s.docs.map(d=>({...d.data(),id:d.id}));
  const now=S.alerts.filter(a=>!a.resolved).length;if(S.role==='admin'&&S.loaded.alerts&&now>before){const nw=S.alerts.find(a=>!a.resolved);toast(nw&&nw.kind==='hint'?'New hint request from '+spotLabel(nw.spotId):'New alert from a spot','bad')}
  const replies=S.alerts.filter(a=>a.spotId===S.spotId&&a.reply&&!a.ack);
  if(S.role==='vol'&&S.loaded.alerts){for(const a of replies)if(!S.seen.has(a.id)){toast(a.reply.hint!=null?'Hint received from the control room':'Control room replied');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
  replies.forEach(a=>S.seen.add(a.id));changed('alerts')}
function onStaffErr(e){console.error(e);if(e&&e.code==='permission-denied'){if(S.role==='admin'||S.role==='vol'){toast('Your PIN was changed or removed. Please sign in again.','bad');logout()}}else toast('Lost live connection. Reload the page.','bad')}
function changed(k){S.loaded[k]=true;if(S.role==='admin'){migrate();scheduleReconcile()}render()}
async function logout(){const role=S.role;stopListen();S.role=null;S.spotId=null;S.tab='dash';lsSet('hh.session',null);closeModal();render({fresh:true});window.scrollTo(0,0);
  const u=S.auth&&S.auth.currentUser;if(u&&(role==='admin'||role==='vol')){
    await Promise.race([S.fs.doc('grants/'+u.uid).delete().catch(()=>{}),new Promise(r=>setTimeout(r,3000))]);try{await S.auth.signOut()}catch(e){}}}

/* Moves PINs out of public data (older versions kept them in meta/event and spots). Runs once, as admin. */
async function migrate(){if(S.migrating||S.migrateTried||S.role!=='admin'||!S.loaded.meta||!S.loaded.spots||!S.loaded.pins)return;
  const legacy=S.spots.filter(s=>s.pin!=null&&s.pin!=='');const adminPin=S.meta.adminPin;
  if(!legacy.length&&adminPin==null)return;S.migrating=S.migrateTried=true;
  try{const fs=S.fs,DEL=firebase.firestore.FieldValue.delete(),b=fs.batch(),have=new Set(S.pins.map(p=>p.id));
    if(adminPin!=null&&String(adminPin)&&!have.has(String(adminPin))){b.set(fs.doc('pins/'+adminPin),{role:'admin'});have.add(String(adminPin))}
    for(const s of legacy){const p=String(s.pin);if(/^\d{1,12}$/.test(p)&&!have.has(p)){b.set(fs.doc('pins/'+p),{role:'vol',spotId:s.id});have.add(p)}b.update(fs.doc('spots/'+s.id),{pin:DEL})}
    if(adminPin!==undefined)b.update(fs.doc('meta/event'),{adminPin:DEL});
    await b.commit();toast('Security upgrade done: PINs are no longer visible to the public.');logEv('admin','Moved PINs to protected storage')}
  catch(e){console.error(e);toast('Security upgrade failed. '+errMsg(e),'bad')}
  S.migrating=false}
/* Keeps the public scoreboard copy in step with the teams. Only the control room does this. */
let recT=null;function scheduleReconcile(){if(S.role!=='admin')return;clearTimeout(recT);recT=setTimeout(reconcile,1500)}
function reconcile(){if(S.role!=='admin'||!S.loaded.teams||!S.loaded.board)return;const b=new Map(S.board.map(x=>[x.id,x]));
  if(S.loaded.spots&&S.loaded.meta&&S.meta.spotCount!==S.spots.length)quiet(saveMeta({spotCount:S.spots.length})); // for the home page count
  for(const t of S.teams){const cur=b.get(t.id);if(!cur||stable(pubTeam(t))!==stable(normBoard(cur)))boardSet(t.id,t)}
  for(const x of S.board)if(!teamById(x.id))quiet(S.fs.doc('board/'+x.id).delete())}
async function seedFromFile(file){let d;try{const txt=await file.text();d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1))}catch(e){d=null}
  if(!d||!d.meta||!d.spots){toast("That file doesn't look like seed-data.js.",'bad');return}
  const ok=await save(async()=>{for(const col of ['meta','spots','teams'])for(const [id,v0] of Object.entries(d[col]||{})){const {adminPin,pin,...v}=v0;
    await S.db.doc(col+'/'+id).set(v);if(col==='teams')boardSet(id,v)}},'Starting data loaded');
  if(ok){toast('Next: create PINs for your spots (Spots tab).');logEv('admin','Loaded starting data')}}

function timeToday(hm,base){if(!hm)return null;const [h,m]=hm.split(':').map(Number);const d=new Date(base||Date.now());d.setHours(h,m,0,0);return d.getTime()}
function armed(btn){if(!btn.dataset.confirm)return true;if(btn.classList.contains('armed'))return true;
  const old=btn.textContent;btn.classList.add('armed');btn.textContent=btn.dataset.confirm;setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old},3000);return false}

  logout(){logout()},

  async outOfOrder(b){const t=teamById(b.dataset.id);const p=progress(t);const s=spotById(S.spotId);const n=+b.dataset.step;
    if(S.alerts.some(a=>!a.resolved&&a.kind==='early'&&a.teamId===t.id&&a.spotId===S.spotId)){toast('Already reported. Waiting for the control room.');return}
    if(await save(()=>S.db.collection('alerts').add({t:Date.now(),kind:'early',type:'Team arrived out of order',teamId:t.id,clue:n,spotId:S.spotId,by:s?.volunteer||'',msg:`${t.name} reached this spot (clue #${n}) but has not checked in for clue #${p.next} yet.`,resolved:false}),'Control room informed'))logEv('alert',`${t.name} arrived early at ${spotLabel(S.spotId)} (clue #${n}); still missing clue #${p.next}`,{teamId:t.id,spotId:S.spotId})},
  hint(b){hintModal(b.dataset.id,b.dataset.alert)},sos(){sosModal()},reqHint(b){reqHintModal(b.dataset.id)},
  copy(b){const t=b.dataset.text;const done=()=>toast('Copied '+t);try{navigator.clipboard.writeText(t).then(done,()=>toast('Number: '+t))}catch(e){toast('Number: '+t)}},
  async genPins(b){const all=b.dataset.all==='1';const taken=new Set(S.pins.map(p=>p.id));const plan=[];
    for(const s of S.spots){const old=pinsOf(s.id);if(!all&&old.length)continue;const np=genPin(taken);taken.add(np);plan.push({s,old,np})}
    if(!plan.length){toast('Every spot already has a PIN.');return}
    const ok=await save(()=>{const bt=S.fs.batch();for(const x of plan){x.old.forEach(p=>bt.delete(S.fs.doc('pins/'+p.id)));bt.set(S.fs.doc('pins/'+x.np),{role:'vol',spotId:x.s.id})}return bt.commit()},
      `${plan.length} new PIN${plan.length>1?'s':''} created. Send each volunteer only their own PIN.`);
    if(ok){S.showPins=true;logEv('admin',`Created ${plan.length} new spot PIN${plan.length>1?'s':''}`);if(S.tab!=='spots'){S.tab='spots';render({fresh:true})}}},
  async ack(b){const a=S.alerts.find(x=>x.id===b.dataset.id);if(await save(()=>S.db.doc('alerts/'+b.dataset.id).update({ack:true,ackAt:Date.now()}),'Marked as done')&&a&&a.kind==='hint'){const t=teamById(a.teamId);logEv('lifeline',`${spotLabel(a.spotId)} shared the hint with ${t?t.name:'team'} (clue #${a.clue})`,{spotId:a.spotId,teamId:a.teamId})}},
  async start(){const ok=await save(()=>saveMeta({status:'live',startedAt:S.meta.startedAt||Date.now(),endedAt:null}),'The hunt is live');if(ok)logEv('event','The hunt started')},
  async end(){if(await save(()=>saveMeta({status:'ended',endedAt:Date.now()}),'The hunt has ended'))logEv('event','The hunt ended')},

  async delTeam(b){const t=teamById(b.dataset.id);if(await save(()=>{quiet(S.fs.doc('board/'+b.dataset.id).delete());return S.db.doc('teams/'+b.dataset.id).delete()},'Team deleted')){closeModal();logEv('admin',`Deleted team ${t?.name}`)}},

  async clearCk(b){const t=teamById(b.dataset.id),n=+b.dataset.step;if(await save(()=>{boardMap(t.id,'checkins',n,null);return S.db.doc('teams/'+t.id).update({checkins:{[n]:null}})},'Arrival cleared')){logEv('undo',`Control room cleared ${t.name}'s arrival for clue #${n}`,{teamId:t.id});progressModal(t.id)}},

    for(const col of ['log','alerts']){const docs=(await S.fs.collection(col).get()).docs;for(let i=0;i<docs.length;i+=400){const b=S.fs.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}},
    'All progress, alerts and the activity log cleared');if(ok)logEv('admin','Progress reset')},
  async csv(){const rows=ranked();const head=['Rank','Code','Team','Captain','Captain phone','Players','Solved','Lifelines used','Start','Finish','Elapsed',...range(N()).map(i=>`Clue ${i} spot`),...range(N()).map(i=>`Clue ${i} arrival`)];
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;

      return [i+1,t.code,t.name,cap.name,cap.phone,(t.players||[]).map(x=>x&&x.name).filter(Boolean).join('; '),p.solved,r.ll,st?fmtT(st):'',p.finished?fmtT(p.last):'',p.finished&&st?fmtDur(p.last-st):'',
       ...route(t).map(x=>spotLabel(x.spotId)),...range(N()).map(k=>(t.checkins||{})[k]?.t?fmtT(t.checkins[k].t):'')].map(q).join(',')}));

};
