const FORMS={
  adminLogin(f){pinLogin(f,'admin','#lg-apin','#lg-aerr')},
  volLogin(f){pinLogin(f,'vol','#lg-vpin','#lg-verr')},
  async bulk(){const err=$('#bk-err');err.textContent='';
    const lines=$('#bk-list').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length){err.textContent='Paste at least one team.';return}
    const have=new Set(S.teams.map(t=>t.name.trim().toLowerCase()));const used=new Set(S.teams.map(t=>t.color));const add=[],bad=[],skip=[];
    for(const l of lines){const m=/^(.+?)\s*\(\s*([^)]*?)\s*\)\s*$/.exec(l);const name=(m?m[1]:l).trim();
      if(have.has(name.toLowerCase())){skip.push(name);continue}
      let color=m&&m[2]?colorByName(m[2]):COLORS.find(c=>!used.has(c));if(!color){bad.push(l);continue}
      used.add(color);have.add(name.toLowerCase());add.push({name,color})}
    if(bad.length){err.textContent='Unknown colour on: '+bad.join('; ')+'. Use one of the colours listed below.';return}
    if(!add.length){err.textContent='All of these teams are already registered.';return}
    const max=+S.meta.maxTeams||0;if(max&&S.teams.length+add.length>max){err.textContent=`That makes ${S.teams.length+add.length} teams, over the limit of ${max}. Delete the example teams or raise the limit in Settings.`;return}
    let no=Math.max(0,...S.teams.map(t=>+(String(t.code).match(/\d+/)||[0])[0]));const now=Date.now();
    const docs=add.map((a,i)=>({id:'t'+(now+i).toString(36),doc:{name:a.name,code:'T'+pad(++no),color:a.color,players:range(4).map(()=>({name:'',phone:''})),captain:0,
      route:range(N()).map(()=>({spotId:'',clue:'',hint:''})),startAt:null,withdrawn:false,checkins:{},lifelines:{},createdAt:now+i}}));
    if(await save(async()=>{for(const x of docs){boardSet(x.id,x.doc);await S.db.doc('teams/'+x.id).set(x.doc)}},
      `${docs.length} team${docs.length>1?'s':''} added${skip.length?` · ${skip.length} already registered`:''}`)){closeModal();logEv('admin',`Added ${docs.length} teams: `+add.map(a=>a.name).join(', '))}},
  async team(f){const id=f.dataset.id;const g=k=>(document.getElementById(k)?.value||'').trim();const name=g('tm-name');if(!name){$('#tm-err').textContent='Give the team a name.';return}
    if(!id&&S.meta.maxTeams&&S.teams.length>=+S.meta.maxTeams){$('#tm-err').textContent=`The team limit (${S.meta.maxTeams}) is reached. Raise it in Settings.`;return}
    const old=id?teamById(id):{};const players=range(4).map(i=>({name:g('tm-p'+i),phone:g('tm-ph'+i)}));
    const rt=range(N()).map(i=>({spotId:g('tm-s'+i),clue:g('tm-c'+i),hint:g('tm-h'+i)}));
    const ids=rt.map(r=>r.spotId).filter(Boolean);if(new Set(ids).size!==ids.length){$('#tm-err').textContent='A spot appears twice in this route. Each clue needs a different spot.';return}
    const st=g('tm-start');
    const doc={name,code:g('tm-code'),color:(f.querySelector('input[name=tm-color]:checked')||{}).value||old.color||COLORS[0],players,captain:+((f.querySelector('input[name=tm-cap]:checked')||{}).value||0),
      route:rt,startAt:st?timeToday(st,S.meta.startedAt||Date.now()):null,withdrawn:!!document.getElementById('tm-wd')?.checked,checkins:old.checkins||{},lifelines:old.lifelines||{},createdAt:old.createdAt||Date.now()};
    const tid=id||('t'+Date.now().toString(36));
    if(await save(()=>{boardSet(tid,doc);return S.db.doc('teams/'+tid).set(doc)},id?'Team saved':`${name} registered`)){closeModal();if(!id)logEv('admin',`Registered team ${name}`)}},
  async spot(f){const id=f.dataset.id;const g=k=>(document.getElementById(k)?.value||'').trim();const err=$('#sp-err');if(!g('sp-name')){err.textContent='Give the spot a name.';return}
    const sid=id||('s'+Date.now().toString(36));const pin=g('sp-pin');const oldPins=id?pinsOf(id):[];const keep=oldPins.length===1&&oldPins[0].id===pin;
    if(!keep&&!/^\d{6,12}$/.test(pin)){err.textContent='The spot PIN must be 6 to 12 digits.';return}
    const clash=S.pins.find(p=>p.id===pin&&!(p.role==='vol'&&p.spotId===sid));if(clash){err.textContent=clash.role==='admin'?'That PIN is the admin PIN. Choose another.':`PIN ${pin} is already used by ${spotLabel(clash.spotId)}.`;return}
    const doc={no:+g('sp-no')||1,name:g('sp-name'),area:g('sp-area'),volunteer:g('sp-vol'),phone:g('sp-ph'),volunteer2:g('sp-vol2'),notes:g('sp-notes'),clue:g('sp-clue'),hint:g('sp-hint'),lat:null,lng:null};
    const llRaw=g('sp-ll');if(llRaw){const m=llRaw.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);if(!m||Math.abs(+m[1])>90||Math.abs(+m[2])>180){err.textContent='Map location should look like 23.0240, 72.5806.';return}doc.lat=+m[1];doc.lng=+m[2]}
    const asg=[...f.querySelectorAll('.asg')].map(r=>({team:r.querySelector('.sa-team').value,step:+r.querySelector('.sa-step').value})).filter(a=>a.team||a.step);
    if(asg.some(a=>!a.team||!a.step)){err.textContent='Choose both a team and a clue number on every row, or remove the row.';return}
    const seen=new Set();for(const a of asg){if(seen.has(a.team)){err.textContent=`${teamById(a.team)?.name} is listed twice. A team visits each spot only once.`;return}seen.add(a.team)}
    const changes=[];for(const t of S.teams){const a=asg.find(x=>x.team===t.id);const rt=route(t).map(r=>({...r}));let ch=false;
      rt.forEach((r,i)=>{if(r.spotId===sid&&!(a&&a.step===i+1)){r.spotId='';ch=true}});
      if(a&&rt[a.step-1].spotId!==sid){rt[a.step-1].spotId=sid;ch=true}
      if(ch)changes.push({t,rt})}
    const ok=await save(async()=>{await S.db.doc('spots/'+sid).set(doc);
      if(!keep){await S.db.doc('pins/'+pin).set({role:'vol',spotId:sid});for(const p of oldPins)if(p.id!==pin)await S.db.doc('pins/'+p.id).delete()}
      for(const c of changes)await S.db.doc('teams/'+c.t.id).update({route:c.rt})},
      changes.length?`Spot saved · ${changes.length} team route${changes.length>1?'s':''} updated`:'Spot saved');
    if(ok){closeModal();if(changes.length)logEv('admin',`Updated teams at ${doc.name}: `+asg.map(a=>`${teamById(a.team)?.name} #${a.step}`).join(', '));if(!keep&&id)logEv('admin',`Changed the PIN for ${doc.name}`)}},
  async arrive(f){const t=teamById(f.dataset.id),n=+f.dataset.step,admin=!!f.dataset.admin;
    const miss=range(n-1).filter(i=>!(t.checkins||{})[i]?.t);if(!admin&&miss.length){toast(`${t.name} hasn't checked in for clue #${miss[0]} yet, so this arrival can't be recorded.`,'bad');closeModal();return}const ts=timeToday($('#ar-time').value)||Date.now();
    const sp=route(t)[n-1].spotId;const by=admin?'admin':S.spotId;const s=spotById(S.spotId);const byName=admin?'Control room':(s?.volunteer||spotLabel(S.spotId));
    const val={t:ts,at:Date.now(),spot:sp,by,byName,note:$('#ar-note').value.trim()};
    const ok=await save(()=>{boardMap(t.id,'checkins',n,val);return S.db.doc('teams/'+t.id).update({checkins:{[n]:val}})},`${t.name} arrived · clue #${n}`);
    if(ok){logEv('arrival',`${t.name} reached ${spotLabel(sp)} (clue #${n}) at ${fmtT(ts)}${n===N()?' and finished the hunt':''}`,{teamId:t.id,spotId:sp});
      if(admin)progressModal(t.id);else closeModal()}},
  async hint(f){const t=teamById(f.dataset.id);const slot=range(LL()).find(i=>!(t.lifelines||{})[i]?.t);if(!slot){toast('No lifelines left','bad');return}
    const n=+$('#hn-clue').value;const note=$('#hn-note').value.trim();const aid=f.dataset.alert;const al=aid&&S.alerts.find(a=>a.id===aid);const hint=al?$('#hn-hint').value:null;
    const val={t:Date.now(),clue:n,note,via:al?al.spotId:'call'};
    const ok=await save(async()=>{boardMap(t.id,'lifelines',slot,val);await S.db.doc('teams/'+t.id).update({lifelines:{[slot]:val}});
      if(al)await S.db.doc('alerts/'+aid).update({resolved:true,resolvedAt:Date.now(),status:'hint',reply:{hint,note,t:Date.now()}})},al?`Hint sent to ${spotLabel(al.spotId)}`:`Lifeline used · ${LL()-llUsed(t)-1} left`);
    if(ok){logEv('lifeline',`${t.name} used lifeline ${slot} on clue #${n}${al?' · hint sent to '+spotLabel(al.spotId):''}`,{teamId:t.id});closeModal()}},
  async reqHint(){const t=teamById($('#rh-team').value);if(!t){$('#rh-err').textContent='Choose the team.';return}const p=progress(t);const s=spotById(S.spotId);
    if(S.alerts.some(a=>!a.resolved&&a.kind==='hint'&&a.teamId===t.id&&a.clue===p.next)){$('#rh-err').textContent=`A hint request for ${t.name} on clue #${p.next} is already waiting.`;return}
    const msg=$('#rh-msg').value.trim();
    if(await save(()=>S.db.collection('alerts').add({t:Date.now(),kind:'hint',type:'Hint request',teamId:t.id,clue:p.next,spotId:S.spotId,by:s?.volunteer||'',msg,resolved:false}),'Hint request sent. The reply will appear on this screen.')){logEv('alert',`${spotLabel(S.spotId)} requested a hint for ${t.name} (clue #${p.next})`,{spotId:S.spotId,teamId:t.id});closeModal()}},
  async resolve(f){const id=f.dataset.id;const a=S.alerts.find(x=>x.id===id);const note=$('#rs-note').value.trim();const notify=$('#rs-notify').checked;
    if(await save(()=>S.db.doc('alerts/'+id).update({resolved:true,resolvedAt:Date.now(),status:'resolved',reply:notify?{note:note||'Resolved by the control room.',t:Date.now()}:null}),notify?'Resolved · volunteer notified':'Resolved')){logEv('admin',`Resolved ${a?a.type:'alert'} from ${spotLabel(a?.spotId)}${note?': '+note:''}`,{spotId:a?.spotId});closeModal()}},
  async sos(){const s=spotById(S.spotId);const type=$('#so-type').value,msg=$('#so-msg').value.trim();
    if(await save(()=>S.db.collection('alerts').add({t:Date.now(),spotId:S.spotId,by:s?.volunteer||'',type,msg,resolved:false}),'Alert sent to the control room')){logEv('alert',`${spotLabel(S.spotId)}: ${type}${msg?' · '+msg:''}`,{spotId:S.spotId});closeModal()}},
  async broadcast(){const msg=$('#bc-msg').value.trim();if(!msg)return;if(await save(()=>saveMeta({broadcast:{msg,t:Date.now()}}),'Sent to all volunteers'))logEv('admin','Broadcast: '+msg)},
  async settings(){const g=k=>(document.getElementById(k)?.value||'').trim();
    const patch={name:g('set-name'),date:g('set-date'),venue:g('set-venue'),series:g('set-series'),startTime:g('set-stime'),startPoint:g('set-spoint'),presenter:g('set-presenter'),tagline:g('set-tagline'),motto:g('set-motto'),hosts:(document.getElementById('set-hosts')?.value||'').trim(),finish:g('set-finish'),phone:g('set-phone'),phone2:g('set-phone2'),cluesToWin:Math.max(1,Math.min(15,+g('set-clues')||8)),lifelines:Math.max(0,Math.min(10,+g('set-ll')||0)),maxTeams:+g('set-max')||16,liveSpots:!!document.getElementById('set-live')?.checked};
    await save(()=>saveMeta(patch),'Event details saved')},
  async adminPin(){const np=$('#ap-new').value.trim();const err=$('#ap-err');err.textContent='';
    if(!/^\d{6,12}$/.test(np)){err.textContent='Use 6 to 12 digits.';return}
    if(S.pins.some(p=>p.id===np)){err.textContent='That PIN is already in use. Choose another.';return}
    const u=S.auth.currentUser;if(!u){err.textContent='Sign in again first.';return}
    const old=S.pins.filter(p=>p.role==='admin');
    if(await save(async()=>{await S.fs.doc('pins/'+np).set({role:'admin'});await S.fs.doc('grants/'+u.uid).set({pin:np,role:'admin',spotId:null,t:Date.now()});
      const b=S.fs.batch();old.forEach(p=>b.delete(S.fs.doc('pins/'+p.id)));await b.commit()},'Admin PIN changed. Other control-room devices must sign in again.')){logEv('admin','Changed the admin PIN');$('#ap-new').value=''}}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f)});

/* ---------- Firebase adapter ---------- */
const MERGE_MAPS=['checkins','lifelines'];
function makeDb(fs){
  const flat=d=>{const o={};for(const k in d){const v=d[k];if(MERGE_MAPS.includes(k)&&v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length){for(const j in v)o[k+'.'+j]=v[j]===undefined?null:v[j]}else o[k]=v===undefined?null:v}return o};
  const w=p=>{let done=false;const guard=new Promise(r=>setTimeout(()=>{if(!done)toast('Saved on this phone. It will sync when the network is back.');r()},6000));return Promise.race([p.then(x=>{done=true;return x}),guard])};
  const wrapDoc=ref=>({id:ref.id,path:ref.path,set:(d,o)=>w(o?ref.set(d,o):ref.set(d)),update:d=>w(ref.update(flat(d))),delete:()=>w(ref.delete())});
  return {doc:p=>wrapDoc(fs.doc(p)),collection:p=>{const c=fs.collection(p);return {add:d=>{const r=c.doc();return w(r.set(d)).then(()=>wrapDoc(r))}}}};
}
/* ---------- boot ---------- */
(async()=>{const sess=lsGet('hh.session');if(sess){S.tab=sess.tab||'dash';if(sess.role==='board')S.role='board'}
  render();
  let fs=null,auth=null;
  try{const cfg=window.HH_FIREBASE;if(window.firebase&&cfg&&cfg.apiKey&&!/PASTE/i.test(cfg.apiKey)){firebase.initializeApp(cfg);fs=firebase.firestore();fs.settings({ignoreUndefinedProperties:true});fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});auth=firebase.auth()}}catch(e){console.error(e)}
  if(!fs||!auth){S.offline=true;S.restoring=false;if(S.role!=='board')S.role=null;render({force:true});return}
  S.fs=fs;S.auth=auth;S.db=makeDb(fs);
  S.dl={save:({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return Promise.resolve({status:'saved'})}};
  const onErr=e=>{console.error(e);toast(e&&e.code==='permission-denied'?'The database refused access. Check the Firestore rules (see the setup guide).':'Lost live connection. Reload the page.','bad')};
  fs.doc('meta/event').onSnapshot(s=>{S.meta=s.exists?{...s.data()}:{};changed('meta')},onErr);
  fs.collection('board').onSnapshot(s=>{S.board=s.docs.map(d=>({...d.data(),id:d.id}));changed('board');scheduleReconcile()},onErr);
  const stop=auth.onAuthStateChanged(async u=>{stop();
    if(u){try{const g=await fs.doc('grants/'+u.uid).get();if(g.exists){const d=g.data();S.restoring=false;enterRole(d.role,d.spotId);return}}catch(e){console.warn(e)}}
    S.restoring=false;render({force:true})});
})();
</script>
