<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B1A10">
<meta name="referrer" content="no-referrer">
<title>Heritage Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Rasa:wght@600;700&family=Hind+Vadodara:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F6F1E8; --surface:#FFFFFF; --surface2:#F1EADD; --ink:#231710; --ink2:#6E5D4F; --line:#E6DCCB;
  --pri:#7A3B1A; --pri-ink:#FFFFFF; --pri-soft:#F5E6DB; --gold:#B07F22; --gold-soft:#F7ECD3;
  --wood:#2B1A10; --wood-ink:#F6EAD3; --wood-acc:#E0B25A;
  --ok:#2C7443; --ok-soft:#E2F1E4; --warn:#955A0C; --warn-soft:#FBEDD6; --bad:#B3261E; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(43,26,16,.06),0 4px 14px rgba(43,26,16,.06); --r:14px;
  --display:"Rozha One",Georgia,serif; --body:"Hind Vadodara",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; --guj:"Rasa","Hind Vadodara",serif;
  --jali:rgba(226,180,88,.16); --patt:rgba(122,84,40,.07); --gate:#C9AE82; --gate2:#B5966A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#15100C; --surface:#1F1813; --surface2:#2A211A; --ink:#F2E7D5; --ink2:#B9A68F; --line:#3A2E25;
  --pri:#E7A07A; --pri-ink:#1A0F09; --pri-soft:#3A2419; --gold:#E0B25A; --gold-soft:#3A2C14;
  --wood:#0D0906; --wood-ink:#F2E4C8; --wood-acc:#E0B25A;
  --ok:#6CC58F; --ok-soft:#173022; --warn:#E6AA55; --warn-soft:#3A2913; --bad:#F08476; --bad-soft:#3E1C18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --jali:rgba(224,178,90,.12); --patt:rgba(224,178,90,.045); --gate:#3A2A1E; --gate2:#4A3626;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15100C; --surface:#1F1813; --surface2:#2A211A; --ink:#F2E7D5; --ink2:#B9A68F; --line:#3A2E25;
  --pri:#E7A07A; --pri-ink:#1A0F09; --pri-soft:#3A2419; --gold:#E0B25A; --gold-soft:#3A2C14;
  --wood:#0D0906; --wood-ink:#F2E4C8; --wood-acc:#E0B25A;
  --ok:#6CC58F; --ok-soft:#173022; --warn:#E6AA55; --warn-soft:#3A2913; --bad:#F08476; --bad-soft:#3E1C18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --jali:rgba(224,178,90,.12); --patt:rgba(224,178,90,.045); --gate:#3A2A1E; --gate2:#4A3626;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.display{font-family:var(--display);font-weight:400}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.warn-t{color:var(--warn)}
.bad-t{color:var(--bad)}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
svg{flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--wood);color:var(--wood-ink);padding-top:env(safe-area-inset-top,0px);border-bottom:2px solid var(--wood-acc)}
.top-in{max-width:1100px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0;display:grid}
.brand h1{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.15}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood-acc)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.status.live i{background:#5BD68A;opacity:1;animation:blink 1.4s infinite}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid rgba(246,234,211,.25);background:transparent;color:inherit;cursor:pointer;flex:none}
.ibtn svg{width:18px;height:18px}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:420px){.status .num{display:none}}

.logobar{background:#FFFCF5;border-bottom:1px solid #EADBBF}
.logobar .in{max-width:1100px;margin:0 auto;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
.logobar img{height:30px;width:auto;padding-inline:10px;object-fit:contain}
.logobar img+img{border-left:1px solid #EADBBF}
@media (max-width:520px){.logobar img{height:22px;padding-inline:6px}}

.banner{background:var(--gold-soft);border-bottom:1px solid var(--gold)}
.banner .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:grid;gap:2px}
.banner b{font-size:12px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}

/* admin tabs: top on wide screens, bottom bar on phones */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .in{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px;display:flex;gap:7px;align-items:center;color:var(--ink2);font-weight:600;cursor:pointer;white-space:nowrap;position:relative}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--pri)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;line-height:18px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tabs .in{padding:4px;gap:0;overflow:visible}
  .tabs button{flex:1 1 0;min-width:0;flex-direction:column;gap:1px;font-size:11px;padding:7px 2px;border-bottom:0;border-radius:10px}
  .tabs button[aria-current="true"]{background:var(--pri-soft);color:var(--pri)}
  .tabs .badge{position:absolute;top:2px;left:calc(50% + 4px);min-width:16px;line-height:16px;font-size:10px}
  body.has-tabs .wrap{padding-bottom:96px}
}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
body.has-bar .wrap{padding-bottom:100px}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.narrow{max-width:640px;margin:0 auto}

/* building blocks */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1E1606}
.btn.danger{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.danger.armed,.btn.solid-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:8px}
.btn.big{min-height:50px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--warn)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.hl-bad{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.card.hl-gold{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.card.hl-warn{background:var(--warn-soft);border-color:transparent;box-shadow:none}
.stack{display:grid;gap:12px;align-content:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.sec{display:grid;gap:10px;margin-bottom:26px;align-content:start}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:18px;display:flex;align-items:baseline;gap:8px}
.two{display:grid;gap:0 22px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:24px;line-height:1.2}
.stat span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
@media (max-width:420px){.stat{padding:8px}.stat b{font-size:19px}.stat span{font-size:9.5px}}
.sw{width:11px;height:11px;border-radius:3px;background:var(--c);display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--gold)}
.dots i.left{background:var(--gold)}
.dots i.used{border-color:var(--line)}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{flex:1;max-width:30px;height:6px;border-radius:3px;background:var(--surface2)}
.pips i.on{background:var(--pri)}
.pips i.nx{background:var(--gold)}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-right:4px;transition:transform .15s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
details[open]>summary{margin-bottom:12px}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.li:last-child{border-bottom:0}
button.li{cursor:pointer}
button.li:hover{background:var(--surface2)}
.li .grow{flex:1;min-width:0;display:grid;gap:1px}
.li .t{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.li .s{font-size:13px;color:var(--ink2)}
.li .r{display:grid;justify-items:end;gap:3px;text-align:right;flex:none}
.li .no{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2);width:24px;flex:none}
.li.is-bad{box-shadow:inset 3px 0 0 var(--bad)}
.li.is-hot{box-shadow:inset 3px 0 0 var(--gold)}
.rk{font-family:var(--display);font-size:22px;color:var(--ink2);width:26px;text-align:center;flex:none}
.rk.first{color:var(--gold)}
.only-wide{} @media (max-width:899px){.only-wide{display:none!important}}
@media (min-width:900px){.only-narrow{display:none!important}}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center;padding-inline:4px}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:24px;border-radius:6px;border:1px dashed var(--line);font-family:var(--mono);font-size:11px;color:var(--ink2)}
.pip.done{background:var(--pri);border:1px solid var(--pri);color:var(--pri-ink)}
.pip.next{border:2px solid var(--gold);color:var(--warn);font-weight:700}
.tname{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.route{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}
.route li{font-family:var(--mono);font-size:12px;background:var(--surface2);border-radius:6px;padding:1px 6px}
.route li.miss{background:var(--warn-soft);color:var(--warn)}
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed time{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--ink2);padding-top:2px}

/* forms */
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-weight:400;color:var(--ink);font-size:16px}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.fgrid .full{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:grid;gap:10px}
legend{font-weight:700;padding:0 6px;font-size:14px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.err:empty{display:none}
.hintline{font-size:13px;color:var(--ink2)}

/* home (original design) */
body.home{background-image:repeating-linear-gradient(45deg,var(--patt) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,var(--patt) 0 1px,transparent 1px 22px),radial-gradient(circle at 11px 11px,var(--patt) 2px,transparent 2.5px);background-size:auto,auto,22px 22px;background-attachment:fixed}
body.home .top{background-image:repeating-linear-gradient(45deg,var(--jali) 0 1px,transparent 1px 13px),repeating-linear-gradient(-45deg,var(--jali) 0 1px,transparent 1px 13px)}
body.home .top::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:8px;background:radial-gradient(circle at 8px 0,var(--gold) 6px,transparent 6.5px) 0 0/16px 8px repeat-x;pointer-events:none}
body.home .wrap{padding-top:26px}
.login{display:grid;gap:26px;max-width:1000px;margin:0 auto}
.hero{position:relative;background:var(--wood);color:var(--wood-ink);border-radius:18px;overflow:hidden;border:1px solid var(--gold);
  background-image:repeating-linear-gradient(45deg,var(--jali) 0 1px,transparent 1px 16px),repeating-linear-gradient(-45deg,var(--jali) 0 1px,transparent 1px 16px)}
.hero-in{position:relative;padding:30px 22px 12px;display:grid;gap:10px;justify-items:center;text-align:center}
.hero .presents{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);max-width:48ch}
.hero .series{font-family:var(--mono);font-size:13px;letter-spacing:.18em;border:1px solid var(--gold);color:var(--gold);padding:3px 12px;border-radius:999px}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,7.5vw,62px);color:var(--wood-ink);line-height:1.02}
.hero .guj{font-family:var(--guj);font-size:clamp(22px,4vw,30px);color:var(--gold);line-height:1;font-weight:700}
.hero .unesco{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--wood);background:var(--gold);padding:5px 14px;border-radius:999px;text-align:center}
.hero .unesco::before,.hero .unesco::after{content:"";width:5px;height:5px;background:currentColor;transform:rotate(45deg);flex:none}
@media (max-width:420px){.hero .unesco{font-size:10.5px;letter-spacing:.08em;padding:5px 10px}}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);width:min(340px,80%)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:currentColor;opacity:.7}
.orn i{width:8px;height:8px;background:currentColor;transform:rotate(45deg)}
.hero .tag{font-size:17px;margin:0;max-width:52ch}
.hero .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.hero .facts span{border:1px solid rgba(224,178,90,.5);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px;background:rgba(255,255,255,.05)}
.hero .facts b{color:var(--gold);font-weight:600;margin-right:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.hero .motto{font-family:var(--display);font-size:19px;color:var(--gold);letter-spacing:.02em}
.hero .hosts{font-size:13px;opacity:.9;max-width:70ch}
.hero .hosts b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.hostnames{display:flex;flex-wrap:nowrap;justify-content:center;gap:4px 0;font-size:13.5px;width:100%}
.hostnames span{white-space:nowrap;padding-inline:12px}
.hostnames span+span{border-left:1px solid rgba(224,178,90,.55)}
@media (max-width:760px){.hostnames{flex-direction:column;align-items:center;gap:2px}.hostnames span+span{border-left:0}}
.hostcard{background:#FFFBF2;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 22px}
.hostcard img{height:58px;width:auto;max-width:100%;object-fit:contain}
@media (max-width:520px){.hostcard img{height:40px}}
.gate{display:block;width:100%;height:auto;margin-top:6px}
.hstats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.warnline{font-size:13px;color:var(--warn)}
.doors{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.door{background:var(--surface);border:1px solid var(--line);border-radius:150px 150px 14px 14px / 70px 70px 14px 14px;padding:34px 20px 20px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow);position:relative}
.door::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-soft);border-radius:inherit;pointer-events:none}
.door>*{position:relative}
.door h3{font-family:var(--display);font-weight:400;font-size:24px;text-align:center}
.door .kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;text-align:center}
.door>p{text-align:center}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:f}
.flow li{counter-increment:f;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:14px;align-items:start}
.flow li::before{flex:none;content:counter(f);font-family:var(--mono);width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.logos{background:#FFFCF5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;justify-items:center}
.logos .lgrp{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 0;width:100%}
.logos .lgrp.hostgrp{border-top:1px solid #EADBBF;padding-top:10px}
.logos .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#8A6A2E;flex-basis:100%;text-align:center}
.logos img{height:28px;width:auto;padding-inline:12px;object-fit:contain}
.logos .lgrp img+img{border-left:1px solid #EADBBF}
.logos.lg{padding:14px 18px;gap:12px}
.logos.lg img{height:52px;padding-inline:20px}
.logos.lg .lgrp.hostgrp img{height:58px}
@media (max-width:640px){.logos img{height:22px;padding-inline:7px}.logos.lg img{height:32px;padding-inline:8px}.logos.lg .lgrp.hostgrp img{height:36px}.logos .lgrp img+img{border-left:0}}
.foot{max-width:1100px;margin:0 auto;padding:0 16px 28px;display:grid;gap:8px;justify-items:center}
.foot p{font-size:12px;color:var(--ink2);text-align:center}
.foot p.copy{font-size:11.5px;opacity:.85;margin-top:2px}
body.has-bar .foot,body.has-tabs .foot{padding-bottom:110px}
@media (min-width:761px){body.has-tabs .foot{padding-bottom:28px}}

/* volunteer */
.vhead{display:grid;gap:2px;margin-bottom:14px}
.vhead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.seg span{padding:8px;text-align:center;font-size:12px;color:var(--ink2);border-left:1px solid var(--line)}
.seg span:first-child{border-left:0}
.seg b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink)}
.seg span.hot b{color:var(--warn)}
.grp-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink2);margin:6px 0 -2px}
.vteam{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.vteam.here{border-color:var(--gold);border-left-color:var(--c);box-shadow:0 0 0 2px var(--gold-soft)}
.vteam h3{font-size:19px}
.vteam .arr{text-align:right;flex:none}
.bigclue{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--pri);line-height:1}
.handover{background:var(--surface2);border-radius:10px;padding:12px;display:grid;gap:4px}
.handover .lbl,.msg .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--pri)}
.handover p{white-space:pre-wrap}
.handover.warn{background:var(--warn-soft)}
.handover.warn .lbl{color:var(--warn)}
.msg{border:2px solid var(--gold);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.msg.hint{background:var(--gold-soft)}
.msg .lbl{color:var(--warn)}
.msg .body{font-size:18px;font-weight:600;white-space:pre-wrap}
.msg.wait{border:1px dashed var(--line);background:transparent}
.contact .ph{font-family:var(--mono);font-size:18px;font-weight:700}

/* scoreboard */
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.bhead h2{font-family:var(--display);font-weight:400;font-size:28px}
.btabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.btabs button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:38px}
.btabs button[aria-selected="true"]{background:var(--pri);color:var(--pri-ink)}
.bgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.bgrid.full{grid-template-columns:1fr}
@media (max-width:900px){.bgrid{grid-template-columns:1fr}}
.lb{display:grid;gap:8px}
.lbitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lbitem.open{border-color:var(--gold)}
.lbrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;width:100%;border:0;background:none;color:inherit;text-align:left}
button.lbrow{cursor:pointer}
button.lbrow:hover{background:var(--surface2)}
.lbrow .rk{font-size:26px;width:auto}
.lbrow .tm{text-align:right;font-family:var(--mono);font-size:15px}
.tdetail{padding:12px 14px 14px;display:grid;gap:10px;border-top:1px dashed var(--line)}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:32px minmax(0,1fr) auto 62px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tl li:last-child{border-bottom:0}
.tl .n{font-family:var(--mono);font-weight:700;color:var(--ink2)}
.tl li.done .n{color:var(--pri)}
.tl li.now{background:var(--gold-soft);margin:0 -8px;padding-inline:8px;border-radius:8px;border-bottom-color:transparent}
.tl li.now .n{color:var(--warn)}
.tl .r{text-align:right}
.trailwrap{overflow-x:auto;padding-bottom:4px}
.trail{display:grid;grid-template-columns:repeat(var(--n),minmax(40px,1fr));position:relative;min-height:180px;align-items:end;padding-top:8px}
.trail::before{content:"";position:absolute;left:20px;right:20px;bottom:28px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);opacity:.75}
.stn{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.stn .toks{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.stn .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--gold);position:relative}
.stn.fin .dot{background:var(--gold);width:18px;height:18px}
.stn .lbl{font-family:var(--mono);font-size:11px;color:var(--ink2);line-height:16px;white-space:nowrap}
.tok{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 1px rgba(128,128,128,.45);font:700 10px/1 var(--mono);cursor:pointer;display:grid;place-items:center;padding:0}
.tok.sel{outline:3px solid var(--gold);outline-offset:1px}
.tok.moving{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ticker{list-style:none;margin:0;padding:0;display:grid}
.ticker li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ticker li:last-child{border-bottom:0}
.ticker .grow{flex:1;min-width:0}
.ticker .ago{white-space:nowrap}
.map{height:min(540px,65vh);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface2);margin-top:12px}
.maplegend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);min-height:34px}
.chip .sw{background:var(--c)}
.chip.sel{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.maplock{display:flex;gap:12px;align-items:flex-start}
.maplock svg{width:22px;height:22px;color:var(--gold);margin-top:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}

/* modal: bottom sheet on phones */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,6,4,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:761px){.modal{align-items:center;padding:24px}.sheet{width:min(720px,100%);border-radius:16px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:19px}
.sheet-b{padding:16px;display:grid;gap:14px;overflow-y:auto}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--ink2);width:40px;height:40px}
.routerow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.routerow:last-child{border-bottom:0}
.routerow .n{font-family:var(--mono);font-weight:700;color:var(--pri);font-size:17px;padding-top:9px}
.routerow details>summary{font-size:13px;color:var(--ink2);font-weight:500;margin-top:6px}
.routerow details[open]>summary{margin-bottom:6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:30px;height:30px;border-radius:8px;background:var(--c);border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.swatches input:disabled+span{opacity:.25}
.swatches input:checked+span{border-color:var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--gold)}
.player{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;align-items:end}
.player .cap{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:13px}
.steprow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.steprow:last-child{border-bottom:0}
.steprow .acts{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
@media (min-width:600px){.steprow{grid-template-columns:30px minmax(0,1fr) auto}.steprow .acts{grid-column:auto}}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(420px,calc(100% - 32px))}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}
#toast div.bad{background:var(--bad);color:#fff}
</style>
