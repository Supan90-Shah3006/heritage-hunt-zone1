   <fieldset><legend>Teams & clue numbers at this spot</legend>
    <p class="small muted" style="margin:0">Several teams can come here, each with its own clue number. Example: Team 1 arrives with clue #2, Team 2 with clue #7. This updates each team's route.</p>
    <div id="sp-asg" style="display:grid;gap:8px">${(id?stepsAtSpot(id).sort((a,b)=>a.step-b.step):[]).map(x=>asgRow(x.t.id,x.step,id)).join('')}</div>
    <div><button class="btn sm" type="button" data-act="addAsg" data-spot="${id||''}">+ Add a team</button></div></fieldset>
   <span class="err" id="sp-err"></span></form>`,
   `${s?`<button class="btn danger" data-act="delSpot" data-id="${id}" data-confirm="Tap again to delete" style="margin-right:auto">Delete spot</button>`:''}<button class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit" form="spotForm">Save spot</button>`)}

function asgNote(teamId,step,spotId){const t=teamById(teamId);if(!t||!step)return '';const cur=route(t)[step-1].spotId;
  const other=route(t).findIndex(r=>r.spotId===spotId);let n='';
  if(cur&&cur!==spotId)n=`Replaces ${spotLabel(cur)} as clue #${step}.`;
  if(other>=0&&other+1!==step)n+=` Moves from clue #${other+1}.`;
  if((t.checkins||{})[step]?.t)n+=' This clue already has an arrival recorded.';return n.trim()}
function asgRow(teamId,step,spotId){const ts=[...S.teams].sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
  return `<div class="asg" style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:center">
   <select class="sa-team" aria-label="Team"><option value="">Choose team…</option>${ts.map(t=>`<option value="${t.id}" ${t.id===teamId?'selected':''}>${esc(t.code?t.code+' · ':'')}${esc(t.name)}</option>`).join('')}</select>
   <select class="sa-step" aria-label="Clue number"><option value="">Clue #…</option>${range(N()).map(i=>`<option value="${i}" ${i===step?'selected':''}>Clue #${i}</option>`).join('')}</select>
   <button class="btn sm" type="button" data-act="rmAsg" aria-label="Remove">✕</button>
   <span class="sa-note warnline small" style="grid-column:1/-1">${esc(asgNote(teamId,step,spotId))}</span></div>`}
document.addEventListener('change',e=>{const r=e.target.closest('.asg');if(!r)return;const f=r.closest('form');
  r.querySelector('.sa-note').textContent=asgNote(r.querySelector('.sa-team').value,+r.querySelector('.sa-step').value,f.dataset.id)});
function progressModal(id){const t=teamById(id);if(!t)return;const rt=route(t);const ck=t.checkins||{};
  openModal(t.name,`<div class="row"><span class="sw" style="--c:${t.color}"></span><span class="muted">${esc(t.code||'')} · ${progress(t).solved}/${N()} solved · ${dots(t)} ${LL()-llUsed(t)} lifelines left</span></div>
  <div>${range(N()).map(i=>{const c=ck[i];return `<div class="steprow"><span class="num" style="font-weight:700;color:var(--teal)">#${i}</span>
   <div><b>${esc(spotLabel(rt[i-1].spotId))}</b><div class="small muted">${c&&c.t?`Arrived ${fmtT(c.t)}${c.byName?' · logged by '+esc(c.byName):''}`:'Not arrived'}</div></div>
   <span class="row">${c&&c.t?`<button class="btn sm danger" data-act="clearCk" data-id="${id}" data-step="${i}" data-confirm="Tap again">Clear</button>`:''}<button class="btn sm" data-act="arrive" data-id="${id}" data-step="${i}" data-admin="1">${c&&c.t?'Edit time':'Mark arrived'}</button></span></div>`}).join('')}</div>`,
  `<button class="btn" data-act="editTeam" data-id="${id}">Edit team & route</button><button class="btn pri" data-act="close">Done</button>`)}

function arriveModal(id,step,admin){const t=teamById(id);const rt=route(t);const p=progress(t);const c=(t.checkins||{})[step];
  const gaps=range(step-1).filter(i=>!(t.checkins||{})[i]?.t);
  openModal(`${t.name} · clue #${step}`,`<form id="arrForm" data-form="arrive" data-id="${id}" data-step="${step}" data-admin="${admin?1:''}" style="display:grid;gap:12px">
   <div><div class="small muted">Spot</div><b>${esc(spotLabel(rt[step-1].spotId))}</b></div>
   ${gaps.length?`<div class="warnline">No arrival recorded for clue${gaps.length>1?'s':''} #${gaps.join(', #')}. ${admin?'As control room you can still save this (for example if a volunteer forgot to log it).':'Volunteers can only log arrivals in route order.'}</div>`:''}
   ${!isLive()&&!admin?'<div class="warnline">The hunt clock has not been started by the control room.</div>':''}
   <label class="f">Arrival time<input type="time" id="ar-time" value="${fmtHM(c?.t||Date.now())}" step="60"></label>
   <label class="f">Note (optional)<input type="text" id="ar-note" value="${esc(c?.note||'')}" placeholder="e.g. arrived with 3 players"></label></form>`,
  `<button class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit" form="arrForm">Save arrival</button>`)}

function hintModal(id,alertId){const t=teamById(id);const p=progress(t);const al=alertId&&S.alerts.find(a=>a.id===alertId);const n=(al&&al.clue)||p.next||N();const r=route(t)[n-1];const left=LL()-llUsed(t);
  openModal(`Lifeline · ${t.name}`,`<form id="hintForm" data-form="hint" data-id="${id}" data-alert="${alertId||''}" style="display:grid;gap:12px">
   ${al?`<div class="msg" style="border-width:1px"><span class="lbl">Request from ${esc(spotLabel(al.spotId))}${al.by?' · '+esc(al.by):''} · ${fmtT(al.t)}</span>${al.msg?`<div>${esc(al.msg)}</div>`:''}</div>`:''}
   <div class="row sp"><span>Currently solving <b>clue #${n}</b> → ${esc(spotLabel(r.spotId))}</span><span>${dots(t)} <b class="num">${left}</b> left</span></div>
   <div class="handover"><span class="lbl">Clue #${n}</span><p>${clueOf(t,n)?esc(clueOf(t,n)):'<span class="muted">No clue text entered.</span>'}</p></div>
   <div class="handover" style="background:var(--gold-soft)"><span class="lbl" style="color:var(--warn)">Hint for ${esc(spotLabel(r.spotId))}${al?' · sent automatically':''}</span><p>${hintOf(t,n)?esc(hintOf(t,n)):'<span class="muted">No hint saved for this spot. Add it in Spots & volunteers, or type it in the note below.</span>'}</p></div>
   <input type="hidden" id="hn-hint" value="${esc(hintOf(t,n))}">
   <label class="f">${al?'Note for the volunteer (optional)':'Note (optional)'}<textarea id="hn-note" style="min-height:56px" placeholder="${al?'e.g. Tell them to look up at the arches':'e.g. Captain called at 11:20'}"></textarea></label>
   <input type="hidden" id="hn-clue" value="${n}"></form>`,
  `<button class="btn" data-act="close">Close</button><button class="btn gold" type="submit" form="hintForm" ${left?'':'disabled'}>${left?(al?`Send hint · uses 1 lifeline (${left-1} left)`:`Use lifeline (${left-1} left after)`):'No lifelines left'}</button>${al&&!left?`<button class="btn" data-act="resolve" data-id="${al.id}">Reply without hint</button>`:''}`)}

function reqHintModal(id){const ts=[...S.teams].filter(t=>!t.withdrawn&&!progress(t).finished).sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
  const sel=id||'';openModal('Request a hint',`<form id="rhForm" data-form="reqHint" style="display:grid;gap:12px">
  <p class="small muted" style="margin:0">The control room decides and sends the hint back to this screen. A hint uses one of the team's lifelines.</p>
  <label class="f">Team<select id="rh-team">${sel?'':'<option value="">Choose team…</option>'}${ts.map(t=>{const p=progress(t);return `<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)} · stuck on clue #${p.next} · ${LL()-llUsed(t)} lifeline${LL()-llUsed(t)===1?'':'s'} left</option>`}).join('')}</select></label>
  <label class="f">What has the team tried? (optional)<textarea id="rh-msg" placeholder="e.g. They think it's a temple near Manek Chowk"></textarea></label>
  <span class="err" id="rh-err"></span></form>`,`<button class="btn" data-act="close">Cancel</button><button class="btn gold" type="submit" form="rhForm">Send hint request</button>`)}
function resolveModal(id){const a=S.alerts.find(x=>x.id===id);if(!a)return;const t=a.teamId&&teamById(a.teamId);
  openModal(a.kind==='hint'?'Reply without a hint':'Resolve alert',`<form id="rsForm" data-form="resolve" data-id="${id}" style="display:grid;gap:12px">
  <div><b>${esc(a.type)}</b> · ${esc(spotLabel(a.spotId))}${t?' · '+esc(t.name):''}${a.clue?' · clue #'+a.clue:''}</div>${a.msg?`<div class="muted">${esc(a.msg)}</div>`:''}
  <label class="f">Note for the volunteer<textarea id="rs-note" placeholder="${a.kind==='hint'?'e.g. No lifelines left, ask them to keep trying':'e.g. Help is on the way, 5 minutes'}"></textarea></label>
  <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="rs-notify" checked> Show this note on the spot volunteer's screen</label></form>`,
  `<button class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit" form="rsForm">Mark resolved</button>`)}
function sosModal(){openModal('Alert the control room',`<form id="sosForm" data-form="sos" style="display:grid;gap:12px">
  <label class="f">What's happening?<select id="so-type"><option>Need help</option><option>Wrong team arrived</option><option>Team is lost or overdue</option><option>Clue cards missing</option><option>Medical</option><option>Crowd or safety issue</option><option>Other</option></select></label>
  <label class="f">Details<textarea id="so-msg" placeholder="Which team, what you need"></textarea></label></form>`,
  `<button class="btn" data-act="close">Cancel</button><button class="btn danger armed" type="submit" form="sosForm">Send alert</button>`)}

/* ---------- actions ---------- */
function timeToday(hm,base){if(!hm)return null;const [h,m]=hm.split(':').map(Number);const d=new Date(base||Date.now());d.setHours(h,m,0,0);return d.getTime()}
function armed(btn){if(!btn.dataset.confirm)return true;if(btn.classList.contains('armed'))return true;
  const old=btn.textContent;btn.classList.add('armed');btn.textContent=btn.dataset.confirm;setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old},3000);return false}
const ACT={
  logout(){go(null,{spotId:null,tab:'dash'})},
  board(){go('board')},
  tab(b){S.tab=b.dataset.tab;lsSet('hh.session',{role:S.role,spotId:S.spotId,tab:S.tab});render({fresh:true})},
  close(){closeModal()},
  addAsg(b){$('#sp-asg').insertAdjacentHTML('beforeend',asgRow('',null,b.dataset.spot))},
  rmAsg(b){b.closest('.asg').remove()},
  editTeam(b){teamModal(b.dataset.id)},editSpot(b){spotModal(b.dataset.id)},
  progress(b){progressModal(b.dataset.id)},arrive(b){arriveModal(b.dataset.id,+b.dataset.step,!!b.dataset.admin)},
  async outOfOrder(b){const t=teamById(b.dataset.id);const p=progress(t);const s=spotById(S.spotId);const n=+b.dataset.step;
    if(S.alerts.some(a=>!a.resolved&&a.kind==='early'&&a.teamId===t.id&&a.spotId===S.spotId)){toast('Already reported. Waiting for the control room.');return}
    if(await save(()=>S.db.collection('alerts').add({t:Date.now(),kind:'early',type:'Team arrived out of order',teamId:t.id,clue:n,spotId:S.spotId,by:s?.volunteer||'',msg:`${t.name} reached this spot (clue #${n}) but has not checked in for clue #${p.next} yet.`,resolved:false}),'Control room informed'))logEv('alert',`${t.name} arrived early at ${spotLabel(S.spotId)} (clue #${n}); still missing clue #${p.next}`,{teamId:t.id,spotId:S.spotId})},
  hint(b){hintModal(b.dataset.id,b.dataset.alert)},sos(){sosModal()},reqHint(b){reqHintModal(b.dataset.id)},
  copy(b){const t=b.dataset.text;const done=()=>toast('Copied '+t);try{navigator.clipboard.writeText(t).then(done,()=>toast('Number: '+t))}catch(e){toast('Number: '+t)}},
  async seed(){const d=window.HH_SEED;if(!d)return;await save(async()=>{for(const [col,docs] of Object.entries(d))for(const [id,v] of Object.entries(docs))await S.db.doc(col+'/'+id).set(v)},'Starting data loaded')},
  async ack(b){const a=S.alerts.find(x=>x.id===b.dataset.id);if(await save(()=>S.db.doc('alerts/'+b.dataset.id).update({ack:true,ackAt:Date.now()}),'Marked as done')&&a&&a.kind==='hint'){const t=teamById(a.teamId);logEv('lifeline',`${spotLabel(a.spotId)} shared the hint with ${t?t.name:'team'} (clue #${a.clue})`,{spotId:a.spotId,teamId:a.teamId})}},
  async start(){const ok=await save(()=>saveMeta({status:'live',startedAt:S.meta.startedAt||Date.now(),endedAt:null}),'The hunt is live');if(ok)logEv('event','The hunt started')},
  async end(){if(await save(()=>saveMeta({status:'ended',endedAt:Date.now()}),'The hunt has ended'))logEv('event','The hunt ended')},
  async setStart(){const v=$('#set-start').value;if(!v)return;await save(()=>saveMeta({startedAt:timeToday(v,S.meta.startedAt||Date.now())}),'Start time updated')},
  async delTeam(b){const t=teamById(b.dataset.id);if(await save(()=>S.db.doc('teams/'+b.dataset.id).delete(),'Team deleted')){closeModal();logEv('admin',`Deleted team ${t?.name}`)}},
  async delSpot(b){const s=spotById(b.dataset.id);if(await save(()=>S.db.doc('spots/'+b.dataset.id).delete(),'Spot deleted')){closeModal();logEv('admin',`Deleted spot ${s?.name}`)}},
  async clearCk(b){const t=teamById(b.dataset.id),n=+b.dataset.step;if(await save(()=>S.db.doc('teams/'+t.id).update({checkins:{[n]:null}}),'Arrival cleared')){logEv('undo',`Control room cleared ${t.name}'s arrival for clue #${n}`,{teamId:t.id});progressModal(t.id)}},
  async volUndo(b){const t=teamById(b.dataset.id),n=+b.dataset.step;if(await save(()=>S.db.doc('teams/'+t.id).update({checkins:{[n]:null}}),'Arrival undone'))logEv('undo',`${spotLabel(S.spotId)} undid ${t.name}'s arrival for clue #${n}`,{teamId:t.id,spotId:S.spotId})},
  async undoLL(b){const t=teamById(b.dataset.id),s=+b.dataset.slot;if(await save(()=>S.db.doc('teams/'+t.id).update({lifelines:{[s]:null}}),'Lifeline returned'))logEv('undo',`Lifeline returned to ${t.name}`,{teamId:t.id})},
  resolve(b){resolveModal(b.dataset.id)},
  async clearBc(){await save(()=>saveMeta({broadcast:null}),'Banner cleared')},
  async reset(){const ok=await save(async()=>{for(const t of S.teams){const {id,...rest}=t;await S.db.doc('teams/'+id).set({...rest,checkins:{},lifelines:{}})}await saveMeta({status:'setup',startedAt:null,endedAt:null})},'All progress cleared');if(ok)logEv('admin','Progress reset')},
  async csv(){const rows=ranked();const head=['Rank','Code','Team','Captain','Captain phone','Players','Solved','Lifelines used','Start','Finish','Elapsed',...range(N()).map(i=>`Clue ${i} spot`),...range(N()).map(i=>`Clue ${i} arrival`)];
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const lines=[head.map(q).join(',')].concat(rows.map((r,i)=>{const t=r.t,p=r.p,cap=(t.players||[])[t.captain||0]||{},st=startOf(t);
      return [i+1,t.code,t.name,cap.name,cap.phone,(t.players||[]).map(x=>x&&x.name).filter(Boolean).join('; '),p.solved,r.ll,st?fmtT(st):'',p.finished?fmtT(p.last):'',p.finished&&st?fmtDur(p.last-st):'',
       ...route(t).map(x=>spotLabel(x.spotId)),...range(N()).map(k=>(t.checkins||{})[k]?.t?fmtT(t.checkins[k].t):'')].map(q).join(',')}));
    const data=lines.join('\n');const fn=`heritage-hunt-results-${new Date().toISOString().slice(0,10)}.csv`;
    if(S.dl){try{await S.dl.save({filename:fn,data});toast('Results ready');return}catch(e){if(e&&e.code==='declined')return}}
    const ta=$('#csv-out');ta.hidden=false;ta.value=data;ta.select();toast('Download unavailable here. Copy the CSV from the box.')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(!f)return;
  if(b.tagName==='TR'&&e.target.closest('button'))return;e.preventDefault();if(!armed(b))return;f(b)});

const FORMS={
  adminLogin(){const pin=$('#lg-apin').value.trim();if(pin===String(S.meta.adminPin||'2026'))go('admin',{tab:S.tab||'dash'});else $('#lg-aerr').textContent='That PIN is not right.'},
  volLogin(){const id=$('#lg-spot').value,pin=$('#lg-vpin').value.trim();const s=spotById(id);
    if(!s){$('#lg-verr').textContent='Choose your spot first.';return}if(pin!==String(s.pin||'')){$('#lg-verr').textContent='That PIN does not match this spot.';return}go('vol',{spotId:id})},
  async team(f){const id=f.dataset.id;const g=k=>(document.getElementById(k)?.value||'').trim();const name=g('tm-name');if(!name){$('#tm-err').textContent='Give the team a name.';return}
    if(!id&&S.meta.maxTeams&&S.teams.length>=+S.meta.maxTeams){$('#tm-err').textContent=`The team limit (${S.meta.maxTeams}) is reached. Raise it in Settings.`;return}
    const old=id?teamById(id):{};const players=range(4).map(i=>({name:g('tm-p'+i),phone:g('tm-ph'+i)}));
    const rt=range(N()).map(i=>({spotId:g('tm-s'+i),clue:g('tm-c'+i),hint:g('tm-h'+i)}));
    const ids=rt.map(r=>r.spotId).filter(Boolean);if(new Set(ids).size!==ids.length){$('#tm-err').textContent='A spot appears twice in this route. Each clue needs a different spot.';return}
    const st=g('tm-start');
    const doc={name,code:g('tm-code'),color:(f.querySelector('input[name=tm-color]:checked')||{}).value||COLORS[0],players,captain:+((f.querySelector('input[name=tm-cap]:checked')||{}).value||0),
      route:rt,startAt:st?timeToday(st,S.meta.startedAt||Date.now()):null,withdrawn:!!document.getElementById('tm-wd')?.checked,checkins:old.checkins||{},lifelines:old.lifelines||{},createdAt:old.createdAt||Date.now()};
    const tid=id||('t'+Date.now().toString(36));
    if(await save(()=>S.db.doc('teams/'+tid).set(doc),id?'Team saved':`${name} registered`)){closeModal();if(!id)logEv('admin',`Registered team ${name}`)}},
  async spot(f){const id=f.dataset.id;const g=k=>(document.getElementById(k)?.value||'').trim();if(!g('sp-name')){$('#sp-err').textContent='Give the spot a name.';return}
    const pin=g('sp-pin');const clash=S.spots.find(s=>s.id!==id&&String(s.pin)===pin);if(clash){$('#sp-err').textContent=`PIN ${pin} is already used by ${clash.name}.`;return}
    const doc={no:+g('sp-no')||1,name:g('sp-name'),area:g('sp-area'),volunteer:g('sp-vol'),phone:g('sp-ph'),volunteer2:g('sp-vol2'),pin,notes:g('sp-notes'),clue:g('sp-clue'),hint:g('sp-hint')};
    const asg=[...f.querySelectorAll('.asg')].map(r=>({team:r.querySelector('.sa-team').value,step:+r.querySelector('.sa-step').value})).filter(a=>a.team||a.step);
    if(asg.some(a=>!a.team||!a.step)){$('#sp-err').textContent='Choose both a team and a clue number on every row, or remove the row.';return}
    const seen=new Set();for(const a of asg){if(seen.has(a.team)){$('#sp-err').textContent=`${teamById(a.team)?.name} is listed twice. A team visits each spot only once.`;return}seen.add(a.team)}
    const sid=id||('s'+Date.now().toString(36));
    const changes=[];for(const t of S.teams){const a=asg.find(x=>x.team===t.id);const rt=route(t).map(r=>({...r}));let ch=false;
      rt.forEach((r,i)=>{if(r.spotId===sid&&!(a&&a.step===i+1)){r.spotId='';ch=true}});
      if(a&&rt[a.step-1].spotId!==sid){rt[a.step-1].spotId=sid;ch=true}
      if(ch)changes.push({t,rt})}
    const ok=await save(async()=>{await S.db.doc('spots/'+sid).set(doc);for(const c of changes)await S.db.doc('teams/'+c.t.id).update({route:c.rt})},
      changes.length?`Spot saved · ${changes.length} team route${changes.length>1?'s':''} updated`:'Spot saved');
    if(ok){closeModal();if(changes.length)logEv('admin',`Updated teams at ${doc.name}: `+asg.map(a=>`${teamById(a.team)?.name} #${a.step}`).join(', '))}},
  async arrive(f){const t=teamById(f.dataset.id),n=+f.dataset.step,admin=!!f.dataset.admin;
    const miss=range(n-1).filter(i=>!(t.checkins||{})[i]?.t);if(!admin&&miss.length){toast(`${t.name} hasn't checked in for clue #${miss[0]} yet, so this arrival can't be recorded.`,'bad');closeModal();return}const ts=timeToday($('#ar-time').value)||Date.now();
    const sp=route(t)[n-1].spotId;const by=admin?'admin':S.spotId;const s=spotById(S.spotId);const byName=admin?'Control room':(s?.volunteer||spotLabel(S.spotId));
    const ok=await save(()=>S.db.doc('teams/'+t.id).update({checkins:{[n]:{t:ts,at:Date.now(),spot:sp,by,byName,note:$('#ar-note').value.trim()}}}),`${t.name} arrived · clue #${n}`);
    if(ok){logEv('arrival',`${t.name} reached ${spotLabel(sp)} (clue #${n}) at ${fmtT(ts)}${n===N()?' and finished the hunt':''}`,{teamId:t.id,spotId:sp});
      if(admin)progressModal(t.id);else closeModal()}},
  async hint(f){const t=teamById(f.dataset.id);const slot=range(LL()).find(i=>!(t.lifelines||{})[i]?.t);if(!slot){toast('No lifelines left','bad');return}
    const n=+$('#hn-clue').value;const note=$('#hn-note').value.trim();const aid=f.dataset.alert;const al=aid&&S.alerts.find(a=>a.id===aid);const hint=al?$('#hn-hint').value:null;
    const ok=await save(async()=>{await S.db.doc('teams/'+t.id).update({lifelines:{[slot]:{t:Date.now(),clue:n,note,via:al?al.spotId:'call'}}});
      if(al)await S.db.doc('alerts/'+aid).update({resolved:true,resolvedAt:Date.now(),status:'hint',reply:{hint,note,t:Date.now()}})},al?`Hint sent to ${spotLabel(al.spotId)}`:`Lifeline used · ${LL()-llUsed(t)-1} left`);
    if(ok){logEv('lifeline',`${t.name} used lifeline ${slot} on clue #${n}${al?' · hint sent to '+spotLabel(al.spotId):''}`,{teamId:t.id});closeModal()}},
  async reqHint(){const t=teamById($('#rh-team').value);if(!t){$('#rh-err').textContent='Choose the team.';return}const p=progress(t);const s=spotById(S.spotId);
    if(S.alerts.some(a=>!a.resolved&&a.kind==='hint'&&a.teamId===t.id&&a.clue===p.next)){$('#rh-err').textContent=`A hint request for ${t.name} on clue #${p.next} is already waiting.`;return}
    const msg=$('#rh-msg').value.trim();
    if(await save(()=>S.db.collection('alerts').add({t:Date.now(),kind:'hint',type:'Hint request',teamId:t.id,clue:p.next,spotId:S.spotId,by:s?.volunteer||'',msg,resolved:false}),'Hint request sent. The reply will appear on this screen.')){logEv('alert',`${spotLabel(S.spotId)} requested a hint for ${t.name} (clue #${p.next})`,{spotId:S.spotId,teamId:t.id});closeModal()}},
  async resolve(f){const id=f.dataset.id;const a=S.alerts.find(x=>x.id===id);const note=$('#rs-note').value.trim();const notify=$('#rs-notify').checked;
    if(await save(()=>S.db.doc('alerts/'+id).update({resolved:true,resolvedAt:Date.now(),status:'resolved',reply:notify?{note:note||'Resolved by the control room.',t:Date.now()}:null}),notify?'Resolved · volunteer notified':'Resolved')){logEv('admin',`Resolved ${a?a.type:'alert'} from ${spotLabel(a?.spotId)}${note?': '+note:''}`,{spotId:a?.spotId});closeModal()}},
  async sos(){const s=spotById(S.spotId);const type=$('#so-type').value,msg=$('#so-msg').value.trim();
    if(await save(()=>S.db.collection('alerts').add({t:Date.now(),spotId:S.spotId,by:s?.volunteer||'',type,msg,resolved:false}),'Alert sent to the control room')){logEv('alert',`${spotLabel(S.spotId)}: ${type}${msg?' · '+msg:''}`,{spotId:S.spotId});closeModal()}},
  async broadcast(){const msg=$('#bc-msg').value.trim();if(!msg)return;if(await save(()=>saveMeta({broadcast:{msg,t:Date.now()}}),'Sent to all volunteers'))logEv('admin','Broadcast: '+msg)},
  async settings(){const g=k=>(document.getElementById(k)?.value||'').trim();
    const patch={name:g('set-name'),date:g('set-date'),venue:g('set-venue'),series:g('set-series'),startTime:g('set-stime'),startPoint:g('set-spoint'),presenter:g('set-presenter'),tagline:g('set-tagline'),motto:g('set-motto'),hosts:(document.getElementById('set-hosts')?.value||'').trim(),finish:g('set-finish'),phone:g('set-phone'),phone2:g('set-phone2'),adminPin:g('set-pin')||'2026',cluesToWin:Math.max(1,Math.min(15,+g('set-clues')||8)),lifelines:Math.max(0,Math.min(10,+g('set-ll')||0)),maxTeams:+g('set-max')||16};
    await save(()=>saveMeta(patch),'Event details saved')}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f)});

/* ---------- Firebase adapter ---------- */
const MERGE_MAPS=['checkins','lifelines'];
function makeDb(fs){
  const flat=d=>{const o={};for(const k in d){const v=d[k];if(MERGE_MAPS.includes(k)&&v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length){for(const j in v)o[k+'.'+j]=v[j]===undefined?null:v[j]}else o[k]=v===undefined?null:v}return o};
  const w=p=>{let done=false;const guard=new Promise(r=>setTimeout(()=>{if(!done)toast('Saved on this phone. It will sync when the network is back.');r()},6000));return Promise.race([p.then(x=>{done=true;return x}),guard])};
  const wrapDoc=ref=>({id:ref.id,path:ref.path,get:()=>ref.get().then(s=>({id:s.id,exists:s.exists,data:()=>s.data()})),set:d=>w(ref.set(d)),update:d=>w(ref.update(flat(d))),delete:()=>w(ref.delete()),
    onSnapshot:(n,e)=>ref.onSnapshot(s=>n({id:s.id,exists:s.exists,data:()=>s.data(),metadata:s.metadata}),e)});
  const wrapQ=q=>({where:(...a)=>wrapQ(q.where(...a)),orderBy:(f,d)=>wrapQ(q.orderBy(f,d||'asc')),limit:n=>wrapQ(q.limit(n)),get:()=>q.get(),onSnapshot:(n,e)=>q.onSnapshot(n,e)});
  return {doc:p=>wrapDoc(fs.doc(p)),collection:p=>{const c=fs.collection(p);return Object.assign(wrapQ(c),{doc:id=>wrapDoc(id?c.doc(id):c.doc()),add:d=>{const r=c.doc();return w(r.set(d)).then(()=>wrapDoc(r))}})}};
}
/* ---------- boot ---------- */
(async()=>{const sess=lsGet('hh.session');if(sess&&sess.role){S.role=sess.role;S.spotId=sess.spotId;S.tab=sess.tab||'dash'}
  render();
  let db=null;
  try{const cfg=window.HH_FIREBASE;if(window.firebase&&cfg&&cfg.apiKey&&!/PASTE/i.test(cfg.apiKey)){firebase.initializeApp(cfg);const fs=firebase.firestore();fs.settings({ignoreUndefinedProperties:true});fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});db=makeDb(fs)}}catch(e){console.error(e)}
  S.db=db;if(!db){S.offline=true;S.role=S.role==='board'?'board':null;render({force:true});return}
  S.dl={save:({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return Promise.resolve({status:'saved'})}};
  const onErr=e=>{console.error(e);if(e&&e.code==='permission-denied')toast('The database refused access. Check the Firestore rules (see SETUP guide).','bad');else toast('Lost live connection. Reload the page.','bad')};
  const changed=k=>{S.loaded[k]=true;if(S.role==='vol'&&S.loaded.spots&&!spotById(S.spotId)&&S.spots.length){}render()};
  db.doc('meta/event').onSnapshot(s=>{S.meta=s.exists?{...s.data()}:{};changed('meta')},onErr);
  db.collection('spots').onSnapshot(s=>{S.spots=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(+a.no||0)-(+b.no||0));changed('spots')},onErr);
  db.collection('teams').onSnapshot(s=>{S.teams=s.docs.map(d=>({...d.data(),id:d.id}));changed('teams')},onErr);
  db.collection('log').orderBy('t','desc').limit(150).onSnapshot(s=>{S.log=s.docs.map(d=>({...d.data(),id:d.id}));changed('log')},onErr);
  db.collection('alerts').orderBy('t','desc').limit(60).onSnapshot(s=>{const before=S.alerts.filter(a=>!a.resolved).length;S.alerts=s.docs.map(d=>({...d.data(),id:d.id}));
    const now=S.alerts.filter(a=>!a.resolved).length;if(S.role==='admin'&&S.loaded.alerts&&now>before){const nw=S.alerts.find(a=>!a.resolved);toast(nw&&nw.kind==='hint'?'New hint request from '+spotLabel(nw.spotId):'New alert from a spot','bad')}
    const replies=S.alerts.filter(a=>a.spotId===S.spotId&&a.reply&&!a.ack);S.seen=S.seen||new Set();
    if(S.role==='vol'&&S.loaded.alerts){for(const a of replies)if(!S.seen.has(a.id)){toast(a.reply.hint!=null?'Hint received from the control room':'Control room replied');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
    replies.forEach(a=>S.seen.add(a.id));changed('alerts')},onErr);
})();
</script>
